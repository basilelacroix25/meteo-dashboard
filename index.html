<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station météo — B3D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1418">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1418; --panel:#161D22; --panel-2:#1B2329; --border:#262F35;
  --text:#E8ECEE; --text-muted:#8B98A0;
  --sejour:#3E7CD6; --cuisine:#3FAE56; --chambre:#D64545; --ext:#B8C0C6;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;line-height:1.5;}
.wrap{max-width:1000px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
header{margin-bottom:2rem;}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:2rem;margin:0 0 4px;}
.sub{color:var(--text-muted);font-size:14px;}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;margin:2.5rem 0 1rem;}
.hint{font-size:12px;color:var(--text-muted);margin:-8px 0 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:1rem;}
.card{background:transparent;border:none;border-radius:10px;padding:0;display:flex;flex-direction:column;}
.room-title{font-size:14px;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:7px;font-weight:500;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.metric-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--border);font-size:13px;}
.metric-row:first-of-type{border-top:none;}
.metric-label{color:var(--text-muted);flex:1;}
.metric-value{font-family:'JetBrains Mono',monospace;font-size:14px;white-space:nowrap;}
.pastille{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:8px;flex-shrink:0;}
.trend{display:inline-block;width:16px;text-align:center;margin-left:6px;color:var(--text-muted);flex-shrink:0;}
.trend.up{color:#D64545;}
.trend.down{color:#3E7CD6;}
.minmax-italic{font-style:italic;font-size:11px;color:var(--text-muted);margin:-3px 0 4px;text-align:right;}
.ext-card .wind-block{display:flex;align-items:center;gap:14px;margin-top:8px;border-top:1px solid var(--border);padding-top:10px;}
.rose-combo{width:96px;height:96px;flex-shrink:0;}
.wind-text{font-size:12px;color:var(--text-muted);}
.wind-text .dir{color:var(--text);font-weight:600;font-size:14px;display:block;margin-bottom:4px;}
.wind-text b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.tabs button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Work Sans',sans-serif;}
.tabs button.active{background:var(--panel-2);border-color:var(--text-muted);}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .dash{width:16px;height:0;border-top:2px dashed var(--text-muted);display:inline-block;}
.chartbox{background:transparent;border:none;border-radius:10px;padding:14px 0;height:250px;position:relative;margin-bottom:1.5rem;display:flex;flex-direction:column;}
.chartbox.small{height:190px;}
.axis-label{font-size:11px;color:var(--text-muted);margin:0 0 6px;flex:0 0 auto;}
.canvas-fill{position:relative;flex:1;min-height:0;}
.canvas-fill canvas,.chartbox canvas{touch-action:none;}
.barwrap{background:transparent;border:none;border-radius:10px;padding:14px 0;margin-bottom:1.5rem;height:290px;position:relative;}
.rosewrap{background:transparent;border:none;border-radius:10px;padding:14px 0;margin-bottom:1.5rem;height:260px;position:relative;max-width:320px;}
.timeline-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--border);font-size:12px;}
.timeline-row:first-child{border-top:none;}
.timeline-time{width:78px;flex-shrink:0;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.timeline-text{flex:1;text-align:left;}
.cal-section{margin-top:2rem;}
.cal-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.cal-row .month-label{width:74px;font-size:11px;color:var(--text-muted);flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.cal-row .days{display:flex;gap:2px;flex:1;flex-wrap:nowrap;}
.cal-day{width:9px;height:16px;border-radius:2px;background:#20272d;flex-shrink:0;}
.empty{background:var(--panel);border:1px dashed var(--border);border-radius:10px;padding:2rem;text-align:center;color:var(--text-muted);}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);margin-top:8px;}
.grad{width:90px;height:8px;border-radius:4px;}
.insight-caption{font-size:13px;color:var(--text);margin:0 0 10px;min-height:1.4em;}
.insight-caption b{font-family:'JetBrains Mono',monospace;font-weight:500;}
footer{margin-top:3rem;color:var(--text-muted);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Station météo</h1>
  <p class="sub" id="lastUpdate">En attente des premières données…</p>
</header>

<div class="cards" id="liveCards"></div>

<div id="mainContent"></div>

<footer>Séjour = base station · Chambre = Home Coach · Cuisine = module intérieur additionnel · Extérieur &amp; Anémomètre = modules extérieurs. Données collectées toutes les 15 min via l'API Netatmo. Vent : direction affichée = d'où souffle le vent.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script>
const ROOM_COLOR={'Séjour':'#3E7CD6','Cuisine':'#3FAE56','Chambre':'#D64545'};
const EXT_COLOR='#B8C0C6';
const METRIC_ORDER=['Temperature','Humidity','CO2','Noise'];
const METRIC_LABEL={Temperature:'Température',Humidity:'Humidité',CO2:'CO2',Noise:'Bruit',Pressure:'Pression'};
const METRIC_UNIT={Temperature:'°C',Humidity:'%',CO2:' ppm',Noise:' dB',Pressure:' hPa'};
const METRIC_DECIMALS={Temperature:1,Humidity:0,CO2:0,Noise:0,Pressure:1};
const TOLERANCE={
  Temperature:{idealLo:18,idealHi:24,hardLo:14,hardHi:29},
  Humidity:{idealLo:40,idealHi:60,hardLo:20,hardHi:80},
  CO2:{idealLo:0,idealHi:800,hardLo:0,hardHi:1500},
  Noise:{idealLo:0,idealHi:45,hardLo:0,hardHi:70}
};
const TREND_EPS={Temperature:0.2,Humidity:2,CO2:20,Noise:2,Pressure:0.5,WindStrength:2};
const COMPASS16=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];

// chartjs-plugin-zoom s'enregistre automatiquement via son build UMD.
let syncedCharts=[];
const DETAIL_POINT_THRESHOLD=80;
function adjustTension(chart){
  const xs=chart.scales&&chart.scales.x;
  if(!xs)return;
  chart.data.datasets.forEach(ds=>{
    if(ds._baseTension===undefined)return;
    const xMin=xs.min instanceof Date?xs.min.getTime():xs.min;
    const xMax=xs.max instanceof Date?xs.max.getTime():xs.max;
    const visible=ds.data.filter(p=>{
      const x=p.x instanceof Date?p.x.getTime():(p.x&&p.x.getTime?p.x.getTime():p.x);
      return x>=xMin&&x<=xMax;
    }).length;
    ds.tension = visible>DETAIL_POINT_THRESHOLD ? ds._baseTension : 0;
  });
}
function syncZoomPan(sourceChart){
  const xs=sourceChart.scales.x;
  if(!xs)return;
  document.querySelectorAll('#rangeTabs button').forEach(b=>b.classList.remove('active'));
  const minMs=xs.min instanceof Date?xs.min.getTime():xs.min;
  const maxMs=xs.max instanceof Date?xs.max.getTime():xs.max;
  if(sourceChart._rebuildForWindow)sourceChart._rebuildForWindow(minMs,maxMs);
  adjustTension(sourceChart);
  sourceChart.update('none');
  syncedCharts.forEach(c=>{
    if(c===sourceChart||c.destroyed||!c.options.scales||!c.options.scales.x)return;
    c.options.scales.x.min=xs.min;
    c.options.scales.x.max=xs.max;
    if(c._rebuildForWindow)c._rebuildForWindow(minMs,maxMs);
    adjustTension(c);
    c.update('none');
  });
}
const ZOOM_OPTS={
  pan:{enabled:true,mode:'x',threshold:10,onPanComplete:({chart})=>syncZoomPan(chart)},
  zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x',onZoomComplete:({chart})=>syncZoomPan(chart)}
};
const crosshairPlugin={
  id:'crosshair',
  afterDraw(chart){
    if(chart.config.type!=='line')return;
    const tt=chart.tooltip;
    if(!tt||!tt.opacity||tt.caretX==null)return;
    const x=tt.caretX;
    const {ctx,chartArea}=chart;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x,chartArea.top);
    ctx.lineTo(x,chartArea.bottom);
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(232,236,238,0.35)';
    ctx.stroke();
    ctx.restore();
  }
};
if(window.Chart){ Chart.register(crosshairPlugin); }

if(window.Chart&&Chart.Interaction&&Chart.Interaction.modes){
  Chart.Interaction.modes.xNearest=function(chart,e,options){
    const items=Chart.Interaction.modes.x(chart,e,options);
    const position=Chart.helpers.getRelativePosition(e,chart);
    const byDataset=new Map();
    items.forEach(item=>{
      const el=item.element;
      const dist=Math.abs(el.x-position.x);
      const key=item.datasetIndex;
      if(!byDataset.has(key)||dist<byDataset.get(key).dist){
        byDataset.set(key,{item,dist});
      }
    });
    return Array.from(byDataset.values()).map(v=>v.item);
  };
}

function mix3(a,b,k){return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';}
function gradientColor(t){
  const green=[63,174,86], yellow=[224,178,61], red=[214,69,69];
  if(t<0.5)return mix3(green,yellow,t/0.5);
  return mix3(yellow,red,(t-0.5)/0.5);
}
function pastilleColor(metric,value){
  const r=TOLERANCE[metric];
  if(!r||value===undefined||value===null)return null;
  let badness=0;
  if(value<r.idealLo)badness=(r.idealLo-value)/(r.idealLo-r.hardLo||1);
  else if(value>r.idealHi)badness=(value-r.idealHi)/(r.hardHi-r.idealHi||1);
  return gradientColor(Math.max(0,Math.min(1,badness)));
}
function compassLabel(angle){
  const idx=Math.round(((angle%360)+360)%360/22.5)%16;
  return COMPASS16[idx];
}
function fmt24(d){
  return d.toLocaleString('fr-FR',{hour12:false,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function timeAxis(){
  return {type:'time',
    time:{displayFormats:{minute:'HH:mm',hour:'HH:mm',day:'dd/MM',week:'dd/MM',month:'MM/yyyy',quarter:'MM/yyyy',year:'yyyy'},tooltipFormat:'dd/MM HH:mm'},
    ticks:{color:'#8B98A0',maxRotation:45,minRotation:45},
    grid:{color:(ctx)=>{
      if(!ctx.tick||ctx.tick.value==null)return '#262F35';
      return new Date(ctx.tick.value).getHours()===0?'rgba(232,236,238,0.4)':'#262F35';
    }}};
}
function timeAxisForRange(rangeDays){
  const base=timeAxis();
  if(rangeDays===1){
    base.time.unit='hour'; base.time.stepSize=3;
    base.time.displayFormats.hour='HH:mm';
    base.ticks.autoSkip=false;
  }else if(rangeDays===7){
    base.time.unit='day'; base.time.stepSize=1;
    base.time.displayFormats.day='dd/MM';
  }else if(rangeDays<=90){
    base.time.unit='day'; base.time.stepSize=rangeDays===30?2:7;
    base.time.displayFormats.day='dd/MM';
  }else{
    base.time.unit='month'; base.time.stepSize=1;
    base.time.displayFormats.month='MM/yyyy';
  }
  return base;
}
function tooltipTitle24(items){
  return items.length?fmt24(new Date(items[0].parsed.x)):'';
}
function mix(hexA,hexB,t){
  const pa=hexA.match(/\w\w/g).map(x=>parseInt(x,16));
  const pb=hexB.match(/\w\w/g).map(x=>parseInt(x,16));
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return 'rgb('+c.join(',')+')';
}

let byRoomMetric={};

function trendFor(module,metric){
  const pts=byRoomMetric[module+'|'+metric];
  if(!pts||pts.length<2)return {arrow:'→',cls:'flat'};
  const cutoff=new Date(Date.now()-65*60000);
  const recent=pts.filter(p=>p.t>=cutoff);
  if(recent.length<2)return {arrow:'→',cls:'flat'};
  const first=recent[0].v, last=recent[recent.length-1].v;
  const eps=TREND_EPS[metric]||0.5;
  if(last-first>eps)return {arrow:'↑',cls:'up'};
  if(first-last>eps)return {arrow:'↓',cls:'down'};
  return {arrow:'→',cls:'flat'};
}

function todayMinMax(module,metric){
  const today=new Date().toISOString().slice(0,10);
  const vals=(byRoomMetric[module+'|'+metric]||[]).filter(p=>p.t.toISOString().slice(0,10)===today).map(p=>p.v);
  if(!vals.length)return null;
  return {min:Math.min(...vals),max:Math.max(...vals)};
}

function tempFooterLine(module,temp,hum){
  const mm=todayMinMax(module,'Temperature');
  const parts=[];
  if(mm)parts.push(`min ${mm.min.toFixed(1)}° · max ${mm.max.toFixed(1)}°`);
  const dp=dewPoint(temp,hum);
  if(dp!==null){
    const gap=temp-dp;
    let style='';
    if(gap<=0)style='color:#D64545;';
    else if(gap<=3)style='color:#E8A33D;';
    parts.push(`<span style="${style}">rosée ${dp.toFixed(1)}°</span>`);
  }
  return parts.length?`<p class="minmax-italic">${parts.join(' · ')}</p>`:'';
}
function metricRow(module,metric,value,noPastille,humForDew){
  const unit=METRIC_UNIT[metric]||'';
  const dec=METRIC_DECIMALS[metric]!==undefined?METRIC_DECIMALS[metric]:1;
  const displayVal=(typeof value==='number')?value.toFixed(dec):value;
  const past=noPastille?null:pastilleColor(metric,value);
  const tr=trendFor(module,metric);
  let extra='';
  if(metric==='Temperature'){
    extra=tempFooterLine(module,value,humForDew);
  }
  return `<div class="metric-row">
    <span class="metric-label">${METRIC_LABEL[metric]||metric}</span>
    <span class="metric-value">${displayVal}${unit}</span>
    ${past?`<span class="pastille" style="background:${past}"></span>`:''}
    <span class="trend ${tr.cls}">${tr.arrow}</span>
  </div>${extra}`;
}
function metricRowNoAuto(metric,value){
  const unit=METRIC_UNIT[metric]||'';
  const dec=METRIC_DECIMALS[metric]!==undefined?METRIC_DECIMALS[metric]:1;
  const displayVal=(typeof value==='number')?value.toFixed(dec):value;
  return `<div class="metric-row">
    <span class="metric-label">${METRIC_LABEL[metric]||metric}</span>
    <span class="metric-value">${displayVal}${unit}</span>
  </div>`;
}

function polarPoint(cx,cy,r,angleDeg){
  const rad=angleDeg*Math.PI/180;
  return [cx+r*Math.sin(rad), cy-r*Math.cos(rad)];
}
function wedgePath(cx,cy,rInner,rOuter,a0,a1){
  const [x1,y1]=polarPoint(cx,cy,rOuter,a0);
  const [x2,y2]=polarPoint(cx,cy,rOuter,a1);
  if(rInner<=0.5){
    return `M${cx},${cy} L${x1},${y1} A${rOuter},${rOuter} 0 0 1 ${x2},${y2} Z`;
  }
  const [x3,y3]=polarPoint(cx,cy,rInner,a1);
  const [x4,y4]=polarPoint(cx,cy,rInner,a0);
  return `M${x4},${y4} L${x1},${y1} A${rOuter},${rOuter} 0 0 1 ${x2},${y2} L${x3},${y3} A${rInner},${rInner} 0 0 0 ${x4},${y4} Z`;
}
// Rose des vents dessinée à la main en SVG : chaque secteur est centré
// exactement sur son point cardinal (secteur i va de angle_i - demi-pas à
// angle_i + demi-pas), donc pas d'ambiguïté d'alignement possible.
function buildRoseSVG(values,n,size,opts){
  opts=opts||{};
  const cx=size/2, cy=size/2;
  const margin=opts.margin!==undefined?opts.margin:18;
  const maxR=size/2-margin;
  const gustValues=opts.gustValues;
  const vmax=Math.max(...values,...(gustValues||[]),0.001);
  const step=360/n;
  let bars='';
  for(let i=0;i<n;i++){
    const angle=i*step;
    const a0=angle-step/2, a1=angle+step/2;
    const r=Math.max(2,(values[i]/vmax)*maxR);
    const clickAttr=opts.captionId?` onclick="handleRoseClick(this)" data-dir="${compassLabel(angle)}" data-value="${values[i]}" data-caption="${opts.captionId}" style="cursor:pointer"`:'';
    bars+=`<path d="${wedgePath(cx,cy,0,r,a0,a1)}" fill="rgba(184,192,198,0.55)" stroke="#E8ECEE" stroke-width="0.6"${clickAttr}></path>`;
  }
  let gustDots='';
  if(gustValues){
    for(let i=0;i<n;i++){
      if(!gustValues[i])continue;
      const angle=i*step;
      const gr=Math.max(2,(gustValues[i]/vmax)*maxR);
      const [ox,oy]=polarPoint(cx,cy,gr,angle);
      gustDots+=`<line x1="${cx}" y1="${cy}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="#E8ECEE" stroke-width="1.3"></line>`;
    }
  }
  let grids='';
  if(opts.grid!==false){
    [0.33,0.66,1].forEach(f=>{
      grids+=`<circle cx="${cx}" cy="${cy}" r="${maxR*f}" fill="none" stroke="#262F35" stroke-width="1"/>`;
    });
  }
  let labels='';
  if(opts.labels!==false){
    [['N',0],['E',90],['S',180],['O',270]].forEach(([txt,ang])=>{
      const [lx,ly]=polarPoint(cx,cy,maxR+11,ang);
      labels+=`<text x="${lx}" y="${ly+4}" fill="#B8C0C6" font-size="11" font-weight="600" text-anchor="middle">${txt}</text>`;
    });
  }
  let arrow='';
  if(opts.arrowAngle!==undefined&&opts.arrowAngle!==null){
    const goingTo=(opts.arrowAngle+180)%360;
    const [tx,ty]=polarPoint(cx,cy,maxR*0.92,goingTo);
    const [bx,by]=polarPoint(cx,cy,maxR*0.35,goingTo+180);
    arrow=`<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="#E8ECEE" stroke-width="2.5" stroke-linecap="round"/>`;
    const tip=polarPoint(cx,cy,maxR*0.98,goingTo);
    const wingL=polarPoint(cx,cy,maxR*0.78,goingTo-9);
    const wingR=polarPoint(cx,cy,maxR*0.78,goingTo+9);
    arrow+=`<polygon points="${tip[0]},${tip[1]} ${wingL[0]},${wingL[1]} ${wingR[0]},${wingR[1]}" fill="#E8ECEE"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grids}${bars}${gustDots}${arrow}${labels}</svg>`;
}

function handleRoseClick(el){
  const dir=el.getAttribute('data-dir');
  const val=el.getAttribute('data-value');
  const capId=el.getAttribute('data-caption');
  const suffix=el.hasAttribute('data-suffix')?el.getAttribute('data-suffix'):' km/h';
  const cap=capId&&document.getElementById(capId);
  if(cap)cap.innerHTML=`<b>${dir}</b> : <b>${val}${suffix}</b>`;
}

async function fetchJSON(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('fetch failed: '+url);
  return res.json();
}
async function fetchText(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('fetch failed: '+url);
  return res.text();
}

function computeWindBins(anglePts,speedPts,nDirs){
  // WindAngle Netatmo = direction d'où souffle le vent (convention météo standard) : pas de conversion.
  const sums=new Array(nDirs).fill(0), counts=new Array(nDirs).fill(0);
  const step=360/nDirs;
  anglePts.forEach(p=>{
    const from=((p.v%360)+360)%360;
    const idx=Math.round(from/step)%nDirs;
    let best=null,bestDiff=Infinity;
    speedPts.forEach(sp=>{const diff=Math.abs(sp.t-p.t);if(diff<bestDiff){bestDiff=diff;best=sp.v;}});
    if(best!==null){sums[idx]+=best;counts[idx]++;}
  });
  return sums.map((s,i)=>counts[i]?Math.round((s/counts[i])*10)/10:0);
}

function pressureTrend(){
  const pts=(byRoomMetric['Séjour|Pressure']||[]).filter(p=>p.t>=new Date(Date.now()-3*3600000)).sort((a,b)=>a.t-b.t);
  if(pts.length<2)return null;
  const dtH=(pts[pts.length-1].t-pts[0].t)/3600000;
  if(dtH<=0)return null;
  return (pts[pts.length-1].v-pts[0].v)/dtH;
}
function pressureBadge(rate){
  if(rate===null)return {text:'Tendance inconnue',color:'#8B98A0',arrow:'→'};
  if(rate<=-1)return {text:'Chute rapide — coup de vent possible',color:'#D64545',arrow:'↓'};
  if(rate<=-0.3)return {text:'En baisse',color:'#E8A33D',arrow:'↘'};
  if(rate>=1)return {text:'Remontée rapide',color:'#3E7CD6',arrow:'↑'};
  if(rate>=0.3)return {text:'En hausse',color:'#3E7CD6',arrow:'↗'};
  return {text:'Stable',color:'#8B98A0',arrow:'→'};
}
function pressureColor(rate){
  if(rate<=-1)return '#D64545';
  if(rate>=1)return '#3E7CD6';
  if(Math.abs(rate)<0.3)return '#8B98A0';
  return '#E8A33D';
}

function dewPoint(tempC,rh){
  if(tempC===undefined||rh===undefined||tempC===null||rh===null)return null;
  const a=17.27,b=237.7;
  const alpha=((a*tempC)/(b+tempC))+Math.log(rh/100);
  return (b*alpha)/(a-alpha);
}


function aerationVerdict(co2,hum,extHum){
  let level=0;
  const humHelps=extHum===undefined||hum===undefined||extHum<hum;
  if((co2!==undefined&&co2>1200)||(hum!==undefined&&hum>70&&humHelps))level=2;
  else if((co2!==undefined&&co2>800)||(hum!==undefined&&hum>60&&humHelps))level=1;
  return level;
}
function detectRecentAeration(room){
  const pts=(byRoomMetric[room+'|CO2']||[]).filter(p=>p.t>=new Date(Date.now()-6*3600000)).sort((a,b)=>a.t-b.t);
  if(pts.length<3)return null;
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dtMin=(pts[j].t-pts[i].t)/60000;
      if(dtMin>60)break;
      if(pts[i].v-pts[j].v>=300){
        return {from:pts[i].v,to:pts[j].v,durationMin:Math.round(dtMin),t:pts[j].t};
      }
    }
  }
  return null;
}
function aerationFooter(room,m,ext){
  const level=aerationVerdict(m.CO2,m.Humidity,ext.Humidity);
  const label=['Pas nécessaire','Aérer conseillé','Aérer maintenant'][level];
  const style=level>0?`style="color:${gradientColor(level/2)};"`:'';
  const tempDiff=(m.Temperature!==undefined&&ext.Temperature!==undefined)?(m.Temperature-ext.Temperature):null;
  const aeration=detectRecentAeration(room);
  const hh=aeration?aeration.t.getHours().toString().padStart(2,'0')+':'+aeration.t.getMinutes().toString().padStart(2,'0'):'';
  return `<div style="margin-top:auto;padding-top:8px;">
    <div class="metric-row">
      <span class="metric-label" ${style}>Aération</span>
      <span class="metric-value" ${style} style="font-size:12px;">${label}</span>
    </div>
    ${tempDiff!==null?`<p class="minmax-italic">écart extérieur ${tempDiff>0?'+':''}${tempDiff.toFixed(1)}°C</p>`:''}
    ${aeration?`<p class="minmax-italic" style="color:#3FAE56;">aération détectée à ${hh}&nbsp;(${Math.round(aeration.from)}→${Math.round(aeration.to)}&nbsp;ppm, ~${aeration.durationMin}&nbsp;min)</p>`:''}
  </div>`;
}

function windBarbSVG(cx,cy,goingTo,shaftLen,speedKmh,color){
  color=color||'#E8ECEE';
  const knots=speedKmh/1.852;
  const half=shaftLen/2;
  const tailX=cx-half, tipX=cx+half;
  let inner='';
  if(knots<5){
    inner=`<circle cx="${cx}" cy="${cy}" r="2.5" fill="${color}"/>`;
  }else{
    inner=`<line x1="${tailX.toFixed(1)}" y1="${cy}" x2="${tipX.toFixed(1)}" y2="${cy}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
    let units=Math.round(knots/5);
    let pennants=Math.floor(units/10); units%=10;
    let fulls=Math.floor(units/2);
    let halfBarb=units%2;
    const barbLen=shaftLen*0.36;
    const barbGap=shaftLen*0.15;
    const ang=62*Math.PI/180;
    let x=tipX;
    for(let i=0;i<pennants;i++){
      const x2=x-barbGap*1.7;
      const apexX=x2+barbLen*0.95*Math.cos(ang), apexY=cy-barbLen*0.95*Math.sin(ang);
      inner+=`<polygon points="${x.toFixed(1)},${cy} ${apexX.toFixed(1)},${apexY.toFixed(1)} ${x2.toFixed(1)},${cy}" fill="${color}"/>`;
      x=x2;
    }
    if(pennants>0)x-=barbGap*0.6;
    for(let i=0;i<fulls;i++){
      const ex=x+barbLen*Math.cos(ang), ey=cy-barbLen*Math.sin(ang);
      inner+=`<line x1="${x.toFixed(1)}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${color}" stroke-width="2"/>`;
      x-=barbGap;
    }
    if(halfBarb){
      const hl=barbLen*0.5;
      const ex=x+hl*Math.cos(ang), ey=cy-hl*Math.sin(ang);
      inner+=`<line x1="${x.toFixed(1)}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${color}" stroke-width="2.2"/>`;
    }
  }
  return `<g transform="rotate(${(goingTo-90).toFixed(1)} ${cx} ${cy})">${inner}</g>`;
}

function compassGlowSVG(counts,n,size,arrowAngle,speedKmh){
  const cx=size/2, cy=size/2;
  const rOuter=size/2-14, rInner=rOuter-10;
  const step=360/n;
  const maxC=Math.max(...counts,1);
  let glow='';
  for(let i=0;i<n;i++){
    if(!counts[i])continue;
    const opacity=Math.max(0.1,0.85*(counts[i]/maxC));
    const a0=i*step-step/2, a1=i*step+step/2;
    glow+=`<path d="${wedgePath(cx,cy,rInner,rOuter,a0,a1)}" fill="rgba(232,236,238,${opacity.toFixed(2)})"></path>`;
  }
  const ring=`<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="#262F35" stroke-width="1.5"/>
              <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="#262F35" stroke-width="1"/>`;
  const dots=[[0,'N'],[90,'E'],[180,'S'],[270,'O']].map(([a,txt])=>{
    const [x,y]=polarPoint(cx,cy,rOuter+10,a);
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" fill="#8B98A0" font-size="9" font-weight="600" text-anchor="middle">${txt}</text>`;
  }).join('');
  let arrow='';
  if(arrowAngle!==undefined&&arrowAngle!==null){
    const goingTo=arrowAngle%360;
    arrow=windBarbSVG(cx,cy,goingTo,rInner*1.35,speedKmh||0);
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${ring}${glow}${arrow}${dots}</svg>`;
}

function buildExtDailyRose(currentAngle,currentSpeed){
  const slot=document.getElementById('extDailyRoseSlot');
  if(!slot)return;
  const today=new Date(); today.setHours(0,0,0,0);
  const anglePts=(byRoomMetric['Anémomètre|WindAngle']||[]).filter(p=>p.t>=today);
  const n=24, step=360/n;
  const counts=new Array(n).fill(0);
  anglePts.forEach(p=>{
    const a=((p.v%360)+360)%360;
    const idx=Math.round(a/step)%n;
    counts[idx]++;
  });
  slot.innerHTML=compassGlowSVG(counts,n,96,currentAngle,currentSpeed);
}

const WEATHER_ICON_CACHE={};
async function fetchWeatherIcons(days){
  if(!days.length)return {};
  const start=days[0], end=days[days.length-1];
  const cacheKey=start+'_'+end;
  if(WEATHER_ICON_CACHE[cacheKey])return WEATHER_ICON_CACHE[cacheKey];
  try{
    const url=`https://archive-api.open-meteo.com/v1/archive?latitude=47.247&longitude=6.028&start_date=${start}&end_date=${end}&daily=weathercode&timezone=Europe%2FParis`;
    const res=await fetch(url);
    const j=await res.json();
    const map={};
    (j.daily?.time||[]).forEach((d,i)=>{map[d]=j.daily.weathercode[i];});
    WEATHER_ICON_CACHE[cacheKey]=map;
    return map;
  }catch(e){return {};}
}
function weatherCategory(code){
  if(code===undefined||code===null)return null;
  if(code===0)return 'sun';
  if([1,2].includes(code))return 'partly';
  if(code===3)return 'cloud';
  if([45,48].includes(code))return 'fog';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return 'rain';
  if([71,73,75,77,85,86].includes(code))return 'snow';
  if([95,96,99].includes(code))return 'storm';
  return null;
}
function drawWeatherIcon(ctx,category,cx,cy,s,color){
  if(!category)return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.lineJoin='round';
  function cloud(ox,oy,scale){
    ctx.beginPath();
    ctx.arc(ox-0.35*scale,oy,0.32*scale,Math.PI*0.5,Math.PI*1.6);
    ctx.arc(ox+0.05*scale,oy-0.22*scale,0.28*scale,Math.PI*1.1,Math.PI*2.05);
    ctx.arc(ox+0.42*scale,oy,0.30*scale,Math.PI*1.4,Math.PI*0.55);
    ctx.closePath();
    ctx.stroke();
  }
  if(category==='sun'){
    ctx.beginPath(); ctx.arc(cx,cy,s*0.28,0,Math.PI*2); ctx.stroke();
    for(let a=0;a<8;a++){
      const ang=a*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*s*0.42, cy+Math.sin(ang)*s*0.42);
      ctx.lineTo(cx+Math.cos(ang)*s*0.56, cy+Math.sin(ang)*s*0.56);
      ctx.stroke();
    }
  }else if(category==='partly'){
    ctx.beginPath(); ctx.arc(cx-s*0.15,cy-s*0.18,s*0.2,0,Math.PI*2); ctx.stroke();
    cloud(cx+s*0.05,cy+s*0.12,s*0.85);
  }else if(category==='cloud'||category==='fog'){
    cloud(cx,cy,s*0.95);
    if(category==='fog'){
      [0.2,0.34].forEach(o=>{ ctx.beginPath(); ctx.moveTo(cx-s*0.32,cy+s*o); ctx.lineTo(cx+s*0.32,cy+s*o); ctx.stroke(); });
    }
  }else if(category==='rain'){
    cloud(cx,cy-s*0.08,s*0.85);
    [-0.2,0,0.2].forEach(o=>{ ctx.beginPath(); ctx.moveTo(cx+o*s,cy+s*0.26); ctx.lineTo(cx+o*s-s*0.05,cy+s*0.42); ctx.stroke(); });
  }else if(category==='snow'){
    cloud(cx,cy-s*0.08,s*0.85);
    [-0.2,0,0.2].forEach(o=>{ ctx.beginPath(); ctx.arc(cx+o*s,cy+s*0.34,s*0.035,0,Math.PI*2); ctx.fill(); });
  }else if(category==='storm'){
    cloud(cx,cy-s*0.1,s*0.85);
    ctx.beginPath();
    ctx.moveTo(cx+s*0.02,cy+s*0.18);
    ctx.lineTo(cx-s*0.08,cy+s*0.36);
    ctx.lineTo(cx+s*0.03,cy+s*0.36);
    ctx.lineTo(cx-s*0.05,cy+s*0.54);
    ctx.stroke();
  }
  ctx.restore();
}

async function buildDailyMinMaxChart(rows){
  const extTemps=rows.filter(r=>r.module==='Extérieur'&&r.metric==='Temperature');
  const byDay={};
  extTemps.forEach(r=>{
    const d=new Date(r.timestamp_utc);
    const key=d.toISOString().slice(0,10);
    if(!byDay[key])byDay[key]=[];
    byDay[key].push(r.value);
  });
  const days=Object.keys(byDay).sort().slice(-7);
  if(!days.length)return;
  const weekdays=['D','L','M','M','J','V','S'];
  const labels=days.map(k=>{
    const d=new Date(k+'T12:00:00Z');
    return weekdays[d.getUTCDay()]+' '+d.getUTCDate()+'/'+(d.getUTCMonth()+1);
  });
  const mins=days.map(k=>Math.min(...byDay[k]));
  const maxs=days.map(k=>Math.max(...byDay[k]));

  const slot=document.getElementById('minmaxSlot');
  slot.innerHTML=`
    <h2>Min / max journaliers — Extérieur</h2>
    <div class="barwrap"><canvas id="minmaxChart"></canvas></div>
  `;

  const icons=await fetchWeatherIcons(days);

  const minmaxLabels={
    id:'minmaxLabels',
    afterDatasetsDraw(chart){
      const {ctx,chartArea}=chart;
      const meta=chart.getDatasetMeta(0);
      ctx.save();
      ctx.font='11px JetBrains Mono, monospace';
      ctx.fillStyle='#E8ECEE';
      ctx.textAlign='center';
      meta.data.forEach((bar,i)=>{
        ctx.fillText(maxs[i].toFixed(1)+'°', bar.x, bar.y-8);
        ctx.fillText(mins[i].toFixed(1)+'°', bar.x, bar.base+16);
        drawWeatherIcon(ctx, weatherCategory(icons[days[i]]), bar.x, chartArea.bottom+42, 20, '#8B98A0');
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('minmaxChart'),{
    type:'bar',
    data:{labels, datasets:[{
      data: mins.map((mn,i)=>[mn,maxs[i]]),
      backgroundColor:'#F2F4F5',
      borderRadius:{topLeft:999,topRight:999,bottomLeft:999,bottomRight:999},
      borderSkipped:false,
      barPercentage:0.72,
      categoryPercentage:0.9
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:22,bottom:50}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>ctx.raw.map(v=>v.toFixed(1)+'°C').join(' – ')}}},
      scales:{
        x:{ticks:{color:'#8B98A0',maxRotation:0,minRotation:0,autoSkip:false},grid:{display:false}},
        y:{display:false,min:Math.min(...mins)-1.5,max:Math.max(...maxs)+1.5}
      }
    },
    plugins:[minmaxLabels]
  });
}

function detectWindOnsets(afterH,rangeDays){
  const cutoff=rangeDays?new Date(Date.now()-rangeDays*86400000):null;
  const anglePts=(byRoomMetric['Anémomètre|WindAngle']||[]).filter(p=>!cutoff||p.t>=cutoff).sort((a,b)=>a.t-b.t);
  const speedPts=(byRoomMetric['Anémomètre|WindStrength']||[]).filter(p=>!cutoff||p.t>=cutoff).sort((a,b)=>a.t-b.t);
  const tempPts=(byRoomMetric['Extérieur|Temperature']||[]).slice().sort((a,b)=>a.t-b.t);
  const humPts=(byRoomMetric['Extérieur|Humidity']||[]).slice().sort((a,b)=>a.t-b.t);
  function nearestVal(pts,t,maxDiffH){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    if(bd>maxDiffH*3600000)return null;
    return best;
  }
  const CALM=8, BLOWING=15;
  let wasCalm=true;
  const onsets=[];
  speedPts.forEach(p=>{
    if(p.v<CALM)wasCalm=true;
    else if(p.v>=BLOWING&&wasCalm){ onsets.push(p.t); wasCalm=false; }
  });
  const results=[];
  onsets.forEach(t=>{
    const angle=nearestVal(anglePts,t,1);
    if(angle===null)return;
    const tBefore=new Date(t.getTime()-30*60000), tAfter=new Date(t.getTime()+afterH*3600000);
    const tempBefore=nearestVal(tempPts,tBefore,1), tempAfter=nearestVal(tempPts,tAfter,1);
    const humBefore=nearestVal(humPts,tBefore,1), humAfter=nearestVal(humPts,tAfter,1);
    if(tempBefore===null||tempAfter===null)return;
    results.push({angle,dTemp:tempAfter-tempBefore,dHum:(humBefore!==null&&humAfter!==null)?humAfter-humBefore:null});
  });
  return results;
}

function buildDivergingRoseSVG(values,n,size,opts){
  opts=opts||{};
  const cx=size/2, cy=size/2;
  const margin=opts.margin!==undefined?opts.margin:18;
  const maxR=size/2-margin;
  const known=values.filter(v=>v!==null);
  const maxAbs=Math.max(...known.map(v=>Math.abs(v)),0.001);
  const step=360/n;
  let bars='';
  for(let i=0;i<n;i++){
    const v=values[i];
    const angle=i*step;
    const a0=angle-step/2, a1=angle+step/2;
    if(v===null){
      bars+=`<path d="${wedgePath(cx,cy,0,2,a0,a1)}" fill="rgba(139,152,160,0.12)" stroke="none"/>`;
      continue;
    }
    const r=Math.max(3,(Math.abs(v)/maxAbs)*maxR);
    const color=v>0?'rgba(214,69,69,0.6)':'rgba(62,124,214,0.6)';
    const clickAttr=opts.captionId?` onclick="handleRoseClick(this)" data-dir="${compassLabel(angle)}" data-value="${(v>0?'+':'')+v.toFixed(1)}" data-caption="${opts.captionId}" data-suffix="${opts.unit||''}" style="cursor:pointer"`:'';
    bars+=`<path d="${wedgePath(cx,cy,0,r,a0,a1)}" fill="${color}" stroke="#E8ECEE" stroke-width="0.5"${clickAttr}></path>`;
  }
  let grids='';
  if(opts.grid!==false){
    [0.5,1].forEach(f=>{grids+=`<circle cx="${cx}" cy="${cy}" r="${maxR*f}" fill="none" stroke="#262F35" stroke-width="1"/>`;});
  }
  let labels='';
  if(opts.labels!==false){
    [['N',0],['E',90],['S',180],['O',270]].forEach(([txt,ang])=>{
      const [lx,ly]=polarPoint(cx,cy,maxR+11,ang);
      labels+=`<text x="${lx}" y="${ly+4}" fill="#B8C0C6" font-size="10" font-weight="600" text-anchor="middle">${txt}</text>`;
    });
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grids}${bars}${labels}</svg>`;
}

function buildWindImpactRoses(rangeDays,periodLabel){
  const events=detectWindOnsets(2,rangeDays);
  const slot=document.getElementById('windRoseSlot');
  if(!slot)return;
  if(!events.length){
    slot.insertAdjacentHTML('beforeend',`<p class="hint">Aucun coup de vent détecté (montée rapide au-delà de 15 km/h) sur ${periodLabel}.</p>`);
    return;
  }
  const n=16, step=360/n;
  const tempSums=new Array(n).fill(0), tempCounts=new Array(n).fill(0);
  const humSums=new Array(n).fill(0), humCounts=new Array(n).fill(0);
  events.forEach(e=>{
    const from=((e.angle%360)+360)%360;
    const idx=Math.round(((from%360)+360)%360/step)%n;
    tempSums[idx]+=e.dTemp; tempCounts[idx]++;
    if(e.dHum!==null){humSums[idx]+=e.dHum; humCounts[idx]++;}
  });
  const tempVals=tempSums.map((s,i)=>tempCounts[i]?s/tempCounts[i]:null);
  const humVals=humSums.map((s,i)=>humCounts[i]?s/humCounts[i]:null);
  slot.insertAdjacentHTML('beforeend',`
    <p class="hint">Ce que le vent amène : écart de température/humidité extérieure, 2h après le début d'un coup de vent (>15 km/h), selon la direction d'où il souffle. Basé sur ${events.length} épisode${events.length>1?'s':''} détecté${events.length>1?'s':''} sur ${periodLabel}${events.length<8?' — échantillon encore faible, à prendre avec prudence':''}. Rouge = ça monte, bleu = ça descend.</p>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;min-width:0;">
        <p class="insight-caption" id="roseCaptionTemp">Vent → Température</p>
        <div class="rosewrap" style="height:170px;display:flex;align-items:center;justify-content:center;">${buildDivergingRoseSVG(tempVals,16,140,{captionId:'roseCaptionTemp',unit:'°C'})}</div>
      </div>
      <div style="flex:1;min-width:0;">
        <p class="insight-caption" id="roseCaptionHum">Vent → Humidité</p>
        <div class="rosewrap" style="height:170px;display:flex;align-items:center;justify-content:center;">${buildDivergingRoseSVG(humVals,16,140,{captionId:'roseCaptionHum',unit:'%'})}</div>
      </div>
    </div>
  `);
}

function buildWindRose7d(rangeDays,periodLabel){
  const cutoff=new Date(Date.now()-rangeDays*86400000);

function smoothCircular(row,window){
  const n=row.length;
  return row.map((_,i)=>{
    let sum=0,count=0;
    for(let o=-window;o<=window;o++){
      const idx=(i+o+n)%n;
      if(row[idx]!==null&&row[idx]!==undefined){sum+=row[idx];count++;}
    }
    return count?sum/count:null;
  });
}
function hourlyProfile(module,metric,days){
  const cutoff=new Date(Date.now()-days*86400000);
  const buckets=Array.from({length:24},()=>[]);
  (byRoomMetric[module+'|'+metric]||[]).filter(p=>p.t>=cutoff).forEach(p=>{
    buckets[p.t.getHours()].push(p.v);
  });
  const raw=buckets.map(arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null);
  const {out}=interpolateRowCircular(raw);
  return smoothCircular(out,1);
}

function sunTimesLocalHours(date,lat,lon){
  const rad=Math.PI/180;
  const start=Date.UTC(date.getFullYear(),0,0);
  const dayOfYear=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-start)/86400000);
  const zenith=90.833*rad;
  function calc(isSunrise){
    const lngHour=lon/15;
    const t=dayOfYear+((isSunrise?6:18)-lngHour)/24;
    const M=(0.9856*t)-3.289;
    let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634;
    L=((L%360)+360)%360;
    let RA=(180/Math.PI)*Math.atan(0.91764*Math.tan(L*rad));
    RA=((RA%360)+360)%360;
    const Lq=Math.floor(L/90)*90, RAq=Math.floor(RA/90)*90;
    RA=(RA+(Lq-RAq))/15;
    const sinDec=0.39782*Math.sin(L*rad);
    const cosDec=Math.cos(Math.asin(sinDec));
    const cosH=(Math.cos(zenith)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
    if(cosH>1||cosH<-1)return null;
    let H=isSunrise?360-((180/Math.PI)*Math.acos(cosH)):((180/Math.PI)*Math.acos(cosH));
    H/=15;
    const T=H+RA-(0.06571*t)-6.622;
    return ((T-lngHour)%24+24)%24;
  }
  const sunriseUT=calc(true), sunsetUT=calc(false);
  function toLocalHour(utcH){
    if(utcH===null)return null;
    const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
    d.setUTCHours(Math.floor(utcH),Math.round((utcH%1)*60));
    return d.getHours()+d.getMinutes()/60;
  }
  return {sunrise:toLocalHour(sunriseUT),sunset:toLocalHour(sunsetUT)};
}

function buildRiseFallChart(days){
  const profile=hourlyProfile('Extérieur','Temperature',days);
  const known=profile.map((v,h)=>v!==null?h:null).filter(h=>h!==null);
  const caption=document.getElementById('riseFallCaption');
  const canvasWrap=document.getElementById('riseFallCanvasWrap');
  if(!known.length){
    caption.innerHTML='Pas assez de données horaires sur cette période pour estimer les heures de montée/descente.';
    canvasWrap.innerHTML='';
    return;
  }
  let minH=known[0],maxH=known[0];
  known.forEach(h=>{if(profile[h]<profile[minH])minH=h;if(profile[h]>profile[maxH])maxH=h;});
  const sun=sunTimesLocalHours(new Date(),47.247,6.028);
  caption.innerHTML=`La température extérieure commence à <b>monter vers ${minH}h</b> et à <b>redescendre vers ${maxH}h</b> (moyenne sur les ${days} derniers jours).`;
  canvasWrap.innerHTML=chartWrap('riseFallChart','°C');

  function fmtH(h){const hh=Math.floor(h),mm=Math.round((h%1)*60);return hh+'h'+(mm?mm.toString().padStart(2,'0'):'');}

  const markerPlugin={
    id:'markers',
    afterDatasetsDraw(chart){
      const {ctx,chartArea,scales}=chart;
      ctx.save();
      const tempMarks=[[minH,'#3E7CD6','↑ '+minH+'h'],[maxH,'#D64545','↓ '+maxH+'h']];
      const sunMarks=[];
      if(sun.sunrise!==null)sunMarks.push([sun.sunrise,'#E8C34A','☀ '+fmtH(sun.sunrise)]);
      if(sun.sunset!==null)sunMarks.push([sun.sunset,'#E8C34A','☾ '+fmtH(sun.sunset)]);
      tempMarks.forEach(([h,color,label])=>{
        const x=scales.x.getPixelForValue(h);
        ctx.strokeStyle=color; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(x,chartArea.top); ctx.lineTo(x,chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=color; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='center';
        ctx.fillText(label, x, chartArea.top-16);
      });
      sunMarks.forEach(([h,color,label])=>{
        const x=scales.x.getPixelForValue(h);
        ctx.strokeStyle=color; ctx.setLineDash([2,3]);
        ctx.beginPath(); ctx.moveTo(x,chartArea.top); ctx.lineTo(x,chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=color; ctx.font='11px JetBrains Mono, monospace'; ctx.textAlign='center';
        ctx.fillText(label, x, chartArea.top-3);
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('riseFallChart'),{
    type:'line',
    data:{datasets:[{data:profile.map((v,h)=>({x:h,y:v})),borderColor:'#B8C0C6',
      backgroundColor:(context)=>{
        const {ctx,chartArea}=context.chart;
        if(!chartArea)return 'rgba(184,192,198,0.12)';
        const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
        g.addColorStop(0,'rgba(184,192,198,0.28)');
        g.addColorStop(1,'rgba(184,192,198,0)');
        return g;
      },
      fill:true,spanGaps:true,tension:0.35,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:36}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>ctx.parsed.y.toFixed(1)+'°C'}}},
      scales:{x:{type:'linear',min:0,max:23,ticks:{color:'#8B98A0',stepSize:2,callback:(v)=>v+'h'},grid:{display:false}},
              y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}},
    plugins:[markerPlugin]
  });
}

  const axes=[];
  RADAR_METRIC_DEFS.forEach(def=>{
    def.rooms.forEach(room=>{

function periodAverage(rooms,metric,start,end){
  let sum=0,count=0;
  rooms.forEach(room=>{
    (byRoomMetric[room+'|'+metric]||[]).forEach(p=>{
      if(p.t>=start&&p.t<end){sum+=p.v;count++;}
    });
  });
  return count?sum/count:null;
}
function buildComfortRadar(rangeDays){
  const now=new Date();
  const curEnd=now, curStart=new Date(now.getTime()-rangeDays*86400000);
  const prevEnd=curStart, prevStart=new Date(curStart.getTime()-rangeDays*86400000);
  const curRaw=[], prevRaw=[], curVals=[], prevVals=[];
  RADAR_METRICS.forEach(m=>{
    const cv=periodAverage(m.rooms,m.metric,curStart,curEnd);
    const pv=periodAverage(m.rooms,m.metric,prevStart,prevEnd);
    curRaw.push(cv); prevRaw.push(pv);
    curVals.push(cv!==null?Math.max(0,Math.min(100,((cv-m.min)/(m.max-m.min))*100)):0);
    prevVals.push(pv!==null?Math.max(0,Math.min(100,((pv-m.min)/(m.max-m.min))*100)):0);
  });
  const canvas=document.getElementById('comfortRadarChart');
  if(!canvas)return null;
  return new Chart(canvas,{
    type:'radar',
    data:{labels:RADAR_METRICS.map(m=>m.label),datasets:[
      {label:'Période précédente',data:prevVals,borderColor:'#E8ECEE',borderDash:[5,4],backgroundColor:'transparent',pointRadius:0,borderWidth:1.5},
      {label:'Période actuelle',data:curVals,borderColor:'#E8ECEE',backgroundColor:'rgba(232,236,238,0.22)',pointRadius:0,borderWidth:2}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:false,
      plugins:{
        legend:{display:true,position:'top',labels:{color:'#8B98A0',boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{label:(ctx)=>{
          const m=RADAR_METRICS[ctx.dataIndex];
          const raw=ctx.datasetIndex===1?curRaw[ctx.dataIndex]:prevRaw[ctx.dataIndex];
          return ctx.dataset.label+': '+(raw!==null?raw.toFixed(m.dec)+m.unit:'—');
        }}}
      },
      scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:'#262F35'},angleLines:{color:'#262F35'},pointLabels:{color:'#B8C0C6',font:{size:9}}}}
    }
  });
}


function calendarWindow(days,k){
  const now=new Date();
  if(days===1){
    const start=new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate()-k);
    const end=new Date(start); end.setDate(end.getDate()+1);
    return {start,end};
  }
  if(days===7){
    const start=new Date(now); start.setHours(0,0,0,0);
    const dow=(start.getDay()+6)%7;
    start.setDate(start.getDate()-dow-k*7);
    const end=new Date(start); end.setDate(end.getDate()+7);
    return {start,end};
  }
  if(days===30){
    const start=new Date(now.getFullYear(),now.getMonth()-k,1);
    const end=new Date(now.getFullYear(),now.getMonth()-k+1,1);
    return {start,end};
  }
  if(days===365){
    const start=new Date(now.getFullYear()-k,0,1);
    const end=new Date(now.getFullYear()-k+1,0,1);
    return {start,end};
  }
  const end=new Date(now.getTime()-k*days*86400000);
  const start=new Date(now.getTime()-(k+1)*days*86400000);
  return {start,end};
}

function buildDayOverlayChart(days){
  const canvasWrap=document.getElementById('dayOverlayCanvasWrap');
  const opacities=[1,0.7,0.5,0.32];
  const unitNames={1:['Aujourd\'hui','Hier','Avant-hier','Il y a 3 jours'],7:['Cette semaine','Semaine précédente','Il y a 2 semaines','Il y a 3 semaines'],30:['Ce mois-ci','Mois précédent','Il y a 2 mois','Il y a 3 mois'],90:['Cette saison','Saison précédente','Il y a 2 saisons','Il y a 3 saisons'],365:['Cette année','Année précédente','Il y a 2 ans','Il y a 3 ans']};
  const labels=unitNames[days]||['Période actuelle','Période -1','Période -2','Période -3'];
  const datasets=[];
  let maxHours=days*24;
  let refAvg=null;
  for(let k=0;k<4;k++){
    const {start:winStart,end:winEnd}=calendarWindow(days,k);
    const periodHours=(winEnd-winStart)/3600000;
    if(periodHours>maxHours)maxHours=periodHours;
    let pts=(byRoomMetric['Extérieur|Temperature']||[]).filter(p=>p.t>=winStart&&p.t<winEnd).sort((a,b)=>a.t-b.t);
    const avg=pts.length?pts.reduce((a,p)=>a+p.v,0)/pts.length:null;
    if(k===0)refAvg=avg;
    if(days>7)pts=aggregateDaily(pts,'avg');
    if(!pts.length)continue;
    let labelTxt=labels[k];
    if(avg!==null){
      labelTxt+=' ('+avg.toFixed(1)+'°C';
      if(k>0&&refAvg!==null){
        const diff=refAvg-avg;
        labelTxt+=', '+(diff>=0?'+':'')+diff.toFixed(1)+'°C';
      }
      labelTxt+=')';
    }
    datasets.push({
      label:labelTxt,
      data:pts.map(p=>({x:(p.t-winStart)/3600000,y:p.v})),
      borderColor:`rgba(232,236,238,${opacities[k]})`,
      backgroundColor:`rgba(232,236,238,${opacities[k]})`,
      borderWidth:k===0?2.5:1.5,
      pointRadius:0,tension:0.35,_baseTension:0.35
    });
  }
  if(!datasets.length){
    canvasWrap.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;">Pas assez de données Extérieur sur cette période.</div>';
    return;
  }
  canvasWrap.innerHTML=chartWrap('dayOverlayChart','°C');
  new Chart(document.getElementById('dayOverlayChart'),{
    type:'line',
    data:{datasets},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'xNearest',intersect:false},
      elements:{point:{hoverRadius:0,radius:0}},
      animation:false,
      hover:{animationDuration:0},
      responsiveAnimationDuration:0,
      plugins:{legend:{display:true,position:'top',labels:{color:'#8B98A0',boxWidth:12,font:{size:11}}},
               tooltip:{position:'nearest',callbacks:{
                 title:(items)=>{
                   if(!items.length)return '';
                   const totalH=Math.round(items[0].parsed.x);
                   const d=Math.floor(totalH/24), h=totalH%24;
                   return d>0?(d+'j '+h+'h'):h+'h';
                 },
                 label:(ctx)=>(ctx.dataset.label||'')+': '+ctx.parsed.y.toFixed(1)+'°C'
               }}},
      scales:{x:{type:'linear',min:0,max:maxHours,
                  ticks:{color:'#8B98A0',stepSize:days===1?4:24,
                    callback:(v)=>days===1?(v+'h'):('J'+(v/24+1))}, grid:{display:false}},
              y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}}
  });
}

function windIntensityColor(v){
  if(v>40)return '#D64545';
  if(v>25)return '#E8A33D';
  return '#E8ECEE';
}

function aggregateDaily(pts,mode){
  const byDay={};
  pts.forEach(p=>{
    const k=p.t.toISOString().slice(0,10);
    if(!byDay[k])byDay[k]=[];
    byDay[k].push(p);
  });
  return Object.keys(byDay).sort().map(k=>{
    const vals=byDay[k];
    let v;
    if(mode==='max')v=Math.max(...vals.map(p=>p.v));
    else if(mode==='last')v=vals[vals.length-1].v;
    else v=vals.reduce((a,p)=>a+p.v,0)/vals.length;
    return {t:new Date(k+'T12:00:00Z'),v};
  });
}

function smoothedRates(pts,windowH){
  return pts.map(p=>{
    const targetT=p.t.getTime()-windowH*3600000;
    let best=null,bestDiff=Infinity;
    pts.forEach(q=>{
      if(q.t.getTime()>p.t.getTime())return;
      const diff=Math.abs(q.t.getTime()-targetT);
      if(diff<bestDiff){bestDiff=diff;best=q;}
    });
    if(!best||best===p)return 0;
    const dtH=(p.t-best.t)/3600000;
    return dtH>0.25?(p.v-best.v)/dtH:0;
  });
}
function buildPressureChart(rangeDays){
  const aggregated=rangeDays>7;
  let pts=(byRoomMetric['Séjour|Pressure']||[]).sort((a,b)=>a.t-b.t);
  if(aggregated)pts=aggregateDaily(pts,'avg');
  else pts=pts.filter(p=>p.t>=new Date(Date.now()-60*86400000));
  const rates=smoothedRates(pts,aggregated?72:3);
  const dataset={
    label:'Pression',
    data:pts.map(p=>({x:p.t,y:p.v})),
    borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42,

    }},

  };
  const chart=new Chart(document.getElementById('pressureChart'),{
    type:'line',

      responsive:true,maintainAspectRatio:false,

  chart._rebuildForWindow=(minMs,maxMs)=>{
    const windowDays=(maxMs-minMs)/86400000;
    const agg=windowDays>7;
    const pad=(maxMs-minMs)*0.3;
    let wpts=(byRoomMetric['Séjour|Pressure']||[]).filter(p=>p.t.getTime()>=minMs-pad&&p.t.getTime()<=maxMs+pad).sort((a,b)=>a.t-b.t);
    if(agg)wpts=aggregateDaily(wpts,'avg');
    const wrates=smoothedRates(wpts,agg?72:3);
    chart.data.datasets=wpts.length?[{
      label:'Pression',data:wpts.map(p=>({x:p.t,y:p.v})),
      borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42,
      segment:{borderColor:ctx=>pressureColor((wrates[ctx.p0DataIndex]+wrates[ctx.p1DataIndex])/2)},
      borderColor:'#8B98A0'
    }]:[];
  };
  return chart;
}

function buildWindChart(rangeDays){
  const aggregated=rangeDays>7;
  const rawCutoff=new Date(Date.now()-60*86400000);
  let avgPts=byRoomMetric['Anémomètre|WindStrength']||[];
  let gustPts=byRoomMetric['Anémomètre|GustStrength']||[];
  let anglePts=byRoomMetric['Anémomètre|WindAngle']||[];
  if(aggregated){
    avgPts=aggregateDaily(avgPts,'avg');
    gustPts=aggregateDaily(gustPts,'max');
    anglePts=aggregateDaily(anglePts,'last');
  }else{
    avgPts=avgPts.filter(p=>p.t>=rawCutoff);
    gustPts=gustPts.filter(p=>p.t>=rawCutoff);
    anglePts=anglePts.filter(p=>p.t>=rawCutoff);
  }
  function nearestV(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return best;
  }

  const directionArrows={
    id:'directionArrows',
    afterDatasetsDraw(chart){
      if(!anglePts.length)return;
      const {ctx,chartArea,scales}=chart;
      const N=Math.min(aggregated?70:14,anglePts.length);
      const step=Math.max(1,Math.floor(anglePts.length/N));
      ctx.save();
      for(let i=0;i<anglePts.length;i+=step){
        const p=anglePts[i];
        const x=scales.x.getPixelForValue(p.t);
        if(x<chartArea.left||x>chartArea.right)continue;
        const avgV=nearestV(avgPts,p.t), gustV=nearestV(gustPts,p.t);
        const avgY=avgV!==null?scales.y.getPixelForValue(avgV):chartArea.bottom;
        const gustY=gustV!==null?scales.y.getPixelForValue(gustV):avgY;
        const y=Math.min(avgY,gustY)-22;
        const goingTo=(p.v+180)%360;
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(goingTo*Math.PI/180);
        ctx.fillStyle=windIntensityColor(Math.max(avgV||0,gustV||0));
        ctx.beginPath();
        ctx.moveTo(0,-5); ctx.lineTo(-3,3); ctx.lineTo(3,3); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
  };

  return new Chart(document.getElementById('windChart'),{
    type:'line',
    data:{datasets:[
      {label:'Moyenne',data:avgPts.map(p=>({x:p.t,y:p.v})),
       borderWidth:aggregated?2:1.2,pointRadius:0,tension:0.42,_baseTension:0.42,
       segment:{borderColor:ctx=>windIntensityColor(Math.max(ctx.p0.parsed.y,ctx.p1.parsed.y))},
       borderColor:'#E8ECEE',fill:true,
       backgroundColor:(context)=>{
         const {ctx,chartArea}=context.chart;
         if(!chartArea)return 'rgba(232,236,238,0.15)';
         const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
         g.addColorStop(0,'rgba(232,236,238,0.28)');
         g.addColorStop(1,'rgba(232,236,238,0)');
         return g;
       }},
      {label:'Rafale',data:gustPts.map(p=>({x:p.t,y:p.v})),
       borderWidth:aggregated?2:1.2,pointRadius:0,borderDash:[5,4],tension:0.42,_baseTension:0.42,
       segment:{borderColor:ctx=>windIntensityColor(Math.max(ctx.p0.parsed.y,ctx.p1.parsed.y))},
       borderColor:'#E8ECEE',fill:false}
    ].filter(s=>s.data.length>0)},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:20}},
      interaction:{mode:'xNearest',intersect:false},
      elements:{point:{hoverRadius:0,radius:0}},
      animation:false,
      hover:{animationDuration:0},
      responsiveAnimationDuration:0,
      plugins:{legend:{display:false},zoom:ZOOM_OPTS,tooltip:{position:'nearest',callbacks:{

function buildCalendarSection(rows){
  const extTemp={}, sejTemp={}, windSpeed={};
  rows.forEach(r=>{
    const key=new Date(r.timestamp_utc).toISOString().slice(0,10);
    if(r.module==='Extérieur'&&r.metric==='Temperature')(extTemp[key]=extTemp[key]||[]).push(r.value);
    if(r.module==='Séjour'&&r.metric==='Temperature')(sejTemp[key]=sejTemp[key]||[]).push(r.value);
    if(r.module==='Anémomètre'&&r.metric==='WindStrength')(windSpeed[key]=windSpeed[key]||[]).push(r.value);
  });
  const allDays=new Set([...Object.keys(extTemp),...Object.keys(sejTemp),...Object.keys(windSpeed)]);
  if(!allDays.size)return;
  const dayStats={};
  allDays.forEach(k=>{
    dayStats[k]={
      tempMax: extTemp[k]?Math.max(...extTemp[k]):null,
      tempMin: extTemp[k]?Math.min(...extTemp[k]):null,
      sejMax: sejTemp[k]?Math.max(...sejTemp[k]):null,
      sejMin: sejTemp[k]?Math.min(...sejTemp[k]):null,
      windAvg: windSpeed[k]?(windSpeed[k].reduce((a,b)=>a+b,0)/windSpeed[k].length):null
    };
  });
  const sortedKnown=[...allDays].sort();
  const firstDate=new Date(sortedKnown[0]+'T00:00:00Z');
  const lastDate=new Date();
  lastDate.setUTCHours(0,0,0,0);

  // liste continue de tous les jours entre la première mesure et aujourd'hui
  const allSortedDays=[];
  const byMonth={};
  for(let d=new Date(firstDate); d<=lastDate; d.setUTCDate(d.getUTCDate()+1)){
    const k=d.toISOString().slice(0,10);
    allSortedDays.push(k);
    const mk=k.slice(0,7);
    if(!byMonth[mk])byMonth[mk]=[];
    byMonth[mk].push(k);
  }
  const monthKeys=Object.keys(byMonth).sort();
  const monthNames=['jan.','fév.','mar.','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];

  const main=document.getElementById('mainContent');

      <div id="calRows"></div>

    </div>
  `);

  function render(metricKey){

    if(!vals.length)return;
    const vmin=Math.min(...vals), vmax=Math.max(...vals);
    document.getElementById('calScaleLo').textContent=vmin.toFixed(1);

      document.getElementById('calGrad').style.background='linear-gradient(to right,#3E7CD6,#E8ECEE,#D64545)';
      document.getElementById('calScaleLo').textContent='froid';
      document.getElementById('calScaleHi').textContent='chaud';
    }else{
      document.getElementById('calGrad').style.background=`linear-gradient(to right,#${cfg.ramp[0]},${mix(cfg.ramp[0],cfg.ramp[1],1)})`;
    }
    document.getElementById('calSelected').textContent='Touche une case pour voir sa valeur.';
    const rowsWrap=document.getElementById('calRows');
    rowsWrap.innerHTML='';
    const currentYear=new Date().getFullYear().toString();
    const byYear={};

    Object.keys(byYear).sort().forEach(y=>{

      const header=document.createElement('div');

      const monthsWrap=document.createElement('div');
      monthsWrap.style.display=isCurrent?'block':'none';
      header.addEventListener('click',()=>{
        const open=monthsWrap.style.display!=='none';

        daysWrap.className='days';
        byMonth[mk].forEach(k=>{

          const cell=document.createElement('div');
          cell.className='cal-day';

}

function interpolateRowCircular(row){
  const n=row.length;
  const known=[];
  row.forEach((v,i)=>{if(v!==null)known.push(i);});
  const out=row.slice();
  const wasNull=row.map(v=>v===null);
  if(known.length<2)return {out,wasNull};
  for(let i=0;i<n;i++){
    if(out[i]!==null)continue;
    let before=null,after=null,distB=Infinity,distA=Infinity;
    known.forEach(k=>{
      const db=(i-k+n)%n; if(db>0&&db<distB){distB=db;before=k;}
      const da=(k-i+n)%n; if(da>0&&da<distA){distA=da;after=k;}
    });
    if(before===null)out[i]=row[after];
    else if(after===null)out[i]=row[before];
    else{
      const t=distB/(distB+distA);
      out[i]=row[before]+(row[after]-row[before])*t;
    }
  }
  return {out,wasNull};
}

function buildWeeklyProfileHeatmap(rows){
  const cutoff=new Date(Date.now()-30*86400000);
  const recentRows=rows.filter(r=>new Date(r.timestamp_utc)>=cutoff);
  const rooms=['Séjour','Cuisine','Chambre'].filter(room=>recentRows.some(r=>r.module===room&&(r.metric==='CO2'||r.metric==='Noise')));
  if(!rooms.length)return;
  const weekdaysFull=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const order=[1,2,3,4,5,6,0];
  const metricLabel={CO2:'CO2',Noise:'Bruit'};
  const metricUnit={CO2:' ppm',Noise:' dB'};
  const metricRamp={CO2:'3FAE56',Noise:'D64545'};
  function computeAvgGrid(room,metric){
    const metricRows=recentRows.filter(r=>r.module===room&&r.metric===metric);
    const grid=Array.from({length:7},()=>Array.from({length:24},()=>[]));
    metricRows.forEach(r=>{
      const d=new Date(r.timestamp_utc);
      grid[d.getDay()][d.getHours()].push(r.value);
    });
    return grid.map(row=>row.map(arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null));
  }
  const metricScale={};
  ['CO2','Noise'].forEach(metric=>{
    const vals=[];
    rooms.forEach(room=>{
      computeAvgGrid(room,metric).forEach(row=>row.forEach(v=>{if(v!==null)vals.push(v);}));
    });
    if(vals.length)metricScale[metric]={min:Math.min(...vals),max:Math.max(...vals)};
  });

  const main=document.getElementById('mainContent');
  main.insertAdjacentHTML('beforeend',`
    <div class="cal-section">
      <h2>Profil hebdomadaire type</h2>
      <p class="hint">Moyenne par heure et jour de la semaine, sur les 30 derniers jours glissants.</p>
      <div class="tabs" id="weeklyRoomTabs">${rooms.map(r=>`<button data-room="${r}">${r}</button>`).join('')}</div>
      <div class="tabs" id="weeklyMetricTabs"><button data-metric="CO2">CO2</button><button data-metric="Noise">Bruit</button></div>
      <div id="weeklyHeatWrap"></div>
      <div class="scale" id="weeklyScale"></div>
    </div>
  `);

  let curRoom=rooms[0], curMetric='CO2';

  function render(){
    const avgGrid=computeAvgGrid(curRoom,curMetric);
    const interpFlags=[];
    const filledGrid=avgGrid.map(row=>{
      const {out,wasNull}=interpolateRowCircular(row);
      const smoothedOut=smoothCircular(out,3);
      interpFlags.push(wasNull);
      return smoothedOut;
    });
    const allVals=filledGrid.flat().filter(v=>v!==null);
    const wrap=document.getElementById('weeklyHeatWrap');
    const scale=document.getElementById('weeklyScale');
    if(!allVals.length){
      wrap.innerHTML='<div class="empty">Pas assez de données récentes pour cette combinaison.</div>';
      scale.innerHTML='';
      return;
    }
    const vmin=metricScale[curMetric]?metricScale[curMetric].min:Math.min(...allVals);
    const vmax=metricScale[curMetric]?metricScale[curMetric].max:Math.max(...allVals);
    const ramp=metricRamp[curMetric];
    let hourHeader='<div class="cal-row"><div class="month-label" style="width:30px;"></div><div class="days">';
    for(let h=0;h<24;h++){
      hourHeader+=`<div style="width:9px;flex-shrink:0;font-size:8px;color:var(--text-muted);text-align:center;">${h%6===0?h:''}</div>`;
    }
    hourHeader+='</div></div>';
    let rowsHtml=hourHeader;
    order.forEach(wd=>{
      let cellsHtml='';
      for(let h=0;h<24;h++){
        const v=filledGrid[wd][h];
        const interpolated=interpFlags[wd][h];
        let bg='#20272d', title=weekdaysFull[wd]+' '+h+'h : pas de données', style='';
        if(v!==null){
          const norm=vmax>vmin?(v-vmin)/(vmax-vmin):0.5;
          bg=curMetric==='CO2'?gradientColor(norm):mix('1B2329',ramp,norm);
          title=weekdaysFull[wd]+' '+h+'h : '+Math.round(v)+metricUnit[curMetric]+(interpolated?' (estimé)':'');
          if(interpolated)style='opacity:0.55;outline:1px dashed rgba(232,236,238,0.25);outline-offset:-1px;';
        }
        cellsHtml+=`<div class="cal-day" title="${title}" style="background:${bg};${style}"></div>`;
      }
      rowsHtml+=`<div class="cal-row"><div class="month-label" style="width:30px;">${weekdaysFull[wd]}</div><div class="days">${cellsHtml}</div></div>`;
    });
    wrap.innerHTML=rowsHtml;
    const gradCss=curMetric==='CO2'?'linear-gradient(to right,#3fae56,#e0b23d,#d64545)':`linear-gradient(to right,#1B2329,${mix('1B2329',ramp,1)})`;
    scale.innerHTML=`<span>${Math.round(vmin)}${metricUnit[curMetric]}</span><div class="grad" style="background:${gradCss}"></div><span>${Math.round(vmax)}${metricUnit[curMetric]}</span>`;
  }

  document.querySelectorAll('#weeklyRoomTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      curRoom=b.dataset.room;
      document.querySelectorAll('#weeklyRoomTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
  document.querySelectorAll('#weeklyMetricTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      curMetric=b.dataset.metric;
      document.querySelectorAll('#weeklyMetricTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
  document.querySelector('#weeklyRoomTabs button').classList.add('active');
  document.querySelector('#weeklyMetricTabs button[data-metric="CO2"]').classList.add('active');
  render();
}

function findGapPeaks(combined){
  const peaks=[];
  let runStart=0, runSign=null;
  function closeRun(endIdx){
    if(runSign===null||runSign===0)return;
    let maxIdx=runStart, maxAbs=0;
    for(let i=runStart;i<endIdx;i++){
      const d=combined[i].ext-combined[i].sej;
      if(Math.abs(d)>maxAbs){maxAbs=Math.abs(d);maxIdx=i;}
    }
    if(maxAbs>=1.5){
      const c=combined[maxIdx];
      peaks.push({
        t:c.t, y:c.ext, diff:c.ext-c.sej, sign:runSign,
        crossStart:combined[runStart].t,
        crossEnd:combined[Math.max(runStart,endIdx-1)].t
      });
    }
  }
  combined.forEach((c,i)=>{
    const d=c.ext-c.sej;
    const sign=d>0.05?1:(d<-0.05?-1:0);
    if(runSign===null){runSign=sign;runStart=i;}
    else if(sign!==0&&sign!==runSign){
      closeRun(i);
      runSign=sign; runStart=i;
    }
  });
  closeRun(combined.length);
  peaks.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  const top=peaks.slice(0,40);
  top.sort((a,b)=>a.t-b.t);
  return top;
}

function buildTempCompareChart(rangeDays){
  const aggregated=rangeDays>7;
  let extPts=(byRoomMetric['Extérieur|Temperature']||[]).sort((a,b)=>a.t-b.t);
  let sejPts=(byRoomMetric['Séjour|Temperature']||[]).sort((a,b)=>a.t-b.t);
  if(aggregated){
    extPts=aggregateDaily(extPts,'avg');
    sejPts=aggregateDaily(sejPts,'avg');
  }else{
    const rawCutoff=new Date(Date.now()-60*86400000);
    extPts=extPts.filter(p=>p.t>=rawCutoff);
    sejPts=sejPts.filter(p=>p.t>=rawCutoff);
  }
  function nearestVal(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return best;
  }
  const combined=extPts.map(p=>{
    const sv=nearestVal(sejPts,p.t);
    return sv!==null?{t:p.t,ext:p.v,sej:sv}:null;
  }).filter(v=>v!==null);

  const redData=combined.map(c=>({x:c.t,y:c.ext>c.sej?c.ext:c.sej}));
  const blueData=combined.map(c=>({x:c.t,y:c.ext<c.sej?c.ext:c.sej}));
  const sejData=combined.map(c=>({x:c.t,y:c.sej}));
  const extData=combined.map(c=>({x:c.t,y:c.ext}));
  const showLabels=rangeDays<=30;
  const peaks=showLabels?findGapPeaks(combined):[];

  const viewCutoff=new Date(Date.now()-rangeDays*86400000);
  const visibleVals=combined.filter(c=>c.t>=viewCutoff).flatMap(c=>[c.ext,c.sej]);
  const yMin=visibleVals.length?Math.min(...visibleVals)-1:undefined;
  const yMax=visibleVals.length?Math.max(...visibleVals)+1:undefined;

  const periodCutoff=new Date(Date.now()-rangeDays*86400000);
  const periodSej=sejPts.filter(p=>p.t>=periodCutoff).map(p=>p.v);
  const sejAvg=periodSej.length?periodSej.reduce((a,b)=>a+b,0)/periodSej.length:null;
  const sejStd=periodSej.length>1?Math.sqrt(periodSej.reduce((a,v)=>a+Math.pow(v-sejAvg,2),0)/periodSej.length):null;
  const stableLabel=sejStd!==null?(sejStd<0.4?'stable':sejStd<1.2?'assez stable':'instable')+' (écart-type '+sejStd.toFixed(1)+'°C)':'—';
  const curDiff=combined.length?combined[combined.length-1].ext-combined[combined.length-1].sej:null;
  const capEl=document.getElementById('tempCompareCaption');
  if(capEl){
    capEl.innerHTML=`Écart actuel : <b style="color:${curDiff===null?'#8B98A0':curDiff>=0?'#D64545':'#3E7CD6'}">${curDiff===null?'—':(curDiff>=0?'+':'')+curDiff.toFixed(1)+'°C'}</b>
      · Séjour ${stableLabel} sur la période
      · moyenne Séjour : <b>${sejAvg!==null?sejAvg.toFixed(1)+'°C':'—'}</b>`;
  }

  const gapLabels={
    id:'gapLabels',
    afterDatasetsDraw(chart){
      if(!showLabels)return;
      const {ctx,scales,chartArea}=chart;
      ctx.save();
      ctx.font='10px JetBrains Mono, monospace';
      ctx.textAlign='center';
      peaks.forEach(p=>{
        const x=scales.x.getPixelForValue(p.t);
        if(x>=chartArea.left&&x<=chartArea.right){
          const y=scales.y.getPixelForValue(p.y);
          const color=p.sign===1?'#D64545':'#3E7CD6';
          const label=(p.diff>0?'+':'')+p.diff.toFixed(1)+'°';
          ctx.fillStyle=color;
          ctx.fillText(label, x, p.sign===1?y-8:y+18);
        }
      });
      // repères d'heure de transition, pleine hauteur, dédupliqués si trop proches à l'écran
      const crossXs=[];
      peaks.forEach(p=>{
        [p.crossStart,p.crossEnd].forEach(ct=>{
          const cx=scales.x.getPixelForValue(ct);
          if(cx<chartArea.left||cx>chartArea.right)return;
          if(crossXs.some(prev=>Math.abs(prev.cx-cx)<28))return;
          crossXs.push({cx,ct});
        });
      });
      crossXs.forEach(({cx,ct})=>{
        ctx.strokeStyle='rgba(232,236,238,0.28)'; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(cx,chartArea.top); ctx.lineTo(cx,chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]);
        const hh=ct.getHours().toString().padStart(2,'0')+':'+ct.getMinutes().toString().padStart(2,'0');
        ctx.save();
        ctx.translate(cx,chartArea.top-4);
        ctx.rotate(-Math.PI/2);
        ctx.fillStyle='#8B98A0';
        ctx.font='9px JetBrains Mono, monospace';
        ctx.textAlign='left';
        ctx.fillText(hh, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }
  };

  return new Chart(document.getElementById('tempCompareChart'),{
    type:'line',
    data:{datasets:[
      {label:'Extérieur plus chaud',data:redData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:2,backgroundColor:'rgba(214,69,69,0.45)'},
      {label:'Extérieur plus froid',data:blueData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:2,backgroundColor:'rgba(62,124,214,0.45)'},
      {label:'Séjour',data:sejData,borderColor:'#E8ECEE',backgroundColor:'#E8ECEE',borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42,fill:false},
      {label:'Extérieur',data:extData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:false,borderColor:'rgba(0,0,0,0)'},
      {label:'Écart',data:combined.map(c=>({x:c.t,y:c.ext-c.sej})),borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:false,borderColor:'rgba(0,0,0,0)'}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:34}},
      interaction:{mode:'xNearest',intersect:false},
      elements:{point:{hoverRadius:0,radius:0}},
      animation:false,
      hover:{animationDuration:0},
      responsiveAnimationDuration:0,
      plugins:{legend:{display:false},zoom:ZOOM_OPTS,
        tooltip:{position:'nearest',filter:(item)=>item.datasetIndex>=2,
          callbacks:{title:tooltipTitle24,
            label:(ctx)=>{
              if(ctx.datasetIndex===4)return 'Écart : '+(ctx.parsed.y>=0?'+':'')+ctx.parsed.y.toFixed(1)+'°C';
              return (ctx.datasetIndex===2?'Séjour: ':'Extérieur: ')+ctx.parsed.y.toFixed(1)+'°C';
            },
            labelTextColor:(ctx)=>ctx.datasetIndex===4?(ctx.parsed.y>=0?'#D64545':'#3E7CD6'):'#E8ECEE'
          }}},
      scales:{x:Object.assign(timeAxisForRange(rangeDays),{min:new Date(Date.now()-rangeDays*86400000),max:new Date()}),
              y:{min:yMin,max:yMax,ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}
    },
    plugins:[gapLabels]
  });
}

function findExtrema(pts,threshold){
  const extrema=[];
  if(pts.length<3)return extrema;
  let direction=null;
  let last=pts[0];
  for(let k=1;k<pts.length;k++){
    const p=pts[k];
    if(direction===null){
      if(p.v-last.v>=threshold){extrema.push({t:last.t,v:last.v,type:'min'});direction='up';last=p;}
      else if(last.v-p.v>=threshold){extrema.push({t:last.t,v:last.v,type:'max'});direction='down';last=p;}
      else if(p.v>last.v||p.v<last.v)last=(direction===null&&Math.abs(p.v-last.v)<threshold)?last:p;
    }else if(direction==='up'){
      if(p.v>=last.v)last=p;
      else if(last.v-p.v>=threshold){extrema.push({t:last.t,v:last.v,type:'max'});direction='down';last=p;}
    }else{
      if(p.v<=last.v)last=p;
      else if(p.v-last.v>=threshold){extrema.push({t:last.t,v:last.v,type:'min'});direction='up';last=p;}
    }
  }
  // le tout premier extremum n'est qu'un artefact du point de départ, pas un vrai retournement
  return extrema.slice(1);
}
function buildTodayTimeline(){
  const today=new Date(); today.setHours(0,0,0,0);
  const events=[];
  ['Séjour','Chambre','Cuisine'].forEach(room=>{
    const pts=(byRoomMetric[room+'|CO2']||[]).filter(p=>p.t>=today).sort((a,b)=>a.t-b.t);
    let crossed1000=false, crossed1500=false;
    pts.forEach(p=>{
      if(!crossed1000&&p.v>1000){events.push({t:p.t,icon:'▲',text:`CO2 ${room} dépasse 1000 ppm`});crossed1000=true;}
      if(!crossed1500&&p.v>1500){events.push({t:p.t,icon:'▲',text:`CO2 ${room} dépasse 1500 ppm`});crossed1500=true;}
    });
    for(let i=0;i<pts.length;i++){
      let found=false;
      for(let j=i+1;j<pts.length;j++){
        const dtMin=(pts[j].t-pts[i].t)/60000;
        if(dtMin>60)break;
        if(pts[i].v-pts[j].v>=300){
          events.push({t:pts[j].t,icon:'⟳',text:`Baisse rapide du CO2 ${room} (${Math.round(pts[i].v)}→${Math.round(pts[j].v)} ppm) → aération probable`});
          i=j; found=true; break;
        }
      }
      if(found)continue;
    }
  });
  const extPts=(byRoomMetric['Extérieur|Temperature']||[]).filter(p=>p.t>=today).sort((a,b)=>a.t-b.t);
  if(extPts.length){
    events.push({t:extPts[0].t,icon:'○',text:`Extérieur ${extPts[0].v.toFixed(1)}°C`});
    const extrema=findExtrema(extPts,1.2);
    extrema.forEach(e=>{
      if(e.type==='min')events.push({t:e.t,icon:'↑',text:`Min extérieur ${e.v.toFixed(1)}°C`});
      else events.push({t:e.t,icon:'↓',text:`Max extérieur ${e.v.toFixed(1)}°C`});
    });
  }
  const pressPts=(byRoomMetric['Séjour|Pressure']||[]).filter(p=>p.t>=today).sort((a,b)=>a.t-b.t);
  if(pressPts.length>=2){
    let worst=null,worstRate=0;
    for(let i=0;i<pressPts.length;i++){
      for(let j=i+1;j<pressPts.length;j++){
        const dtH=(pressPts[j].t-pressPts[i].t)/3600000;
        if(dtH>2.5)break;
        if(dtH<=0)continue;
        const rate=(pressPts[j].v-pressPts[i].v)/dtH;
        if(Math.abs(rate)>Math.abs(worstRate)){worstRate=rate;worst=pressPts[j];}
      }
    }
    if(worst&&Math.abs(worstRate)>=1){
      events.push({t:worst.t,icon:worstRate<0?'▽':'△',text:(worstRate<0?'Chute':'Remontée')+` de pression rapide (${worstRate>0?'+':''}${worstRate.toFixed(1)} hPa/h)`});
    }
  }
  ['Séjour','Chambre'].forEach(room=>{
    const noisePts=(byRoomMetric[room+'|Noise']||[]).filter(p=>p.t>=today);
    if(!noisePts.length)return;
    let maxN=noisePts[0];
    noisePts.forEach(p=>{if(p.v>maxN.v)maxN=p;});
    if(maxN.v>=50)events.push({t:maxN.t,icon:'◆',text:`Pic sonore ${room} ${Math.round(maxN.v)} dB`});
  });
  const gustPts=(byRoomMetric['Anémomètre|GustStrength']||[]).filter(p=>p.t>=today);
  const angleForGust=byRoomMetric['Anémomètre|WindAngle']||[];
  if(gustPts.length){
    let maxG=gustPts[0];
    gustPts.forEach(p=>{if(p.v>maxG.v)maxG=p;});
    if(maxG.v>15){
      let bestA=null,bd=Infinity;
      angleForGust.forEach(p=>{const d=Math.abs(p.t-maxG.t); if(d<bd){bd=d;bestA=p.v;}});
      const dirTxt=bestA!==null?` (${compassLabel(bestA)})`:'';
      events.push({t:maxG.t,icon:'≈',text:`Rafale ${maxG.v} km/h${dirTxt}`});
    }
  }
  events.sort((a,b)=>a.t-b.t);
  const main=document.getElementById('mainContent');
  const html=events.length?events.map(e=>{
    const hh=e.t.getHours().toString().padStart(2,'0')+':'+e.t.getMinutes().toString().padStart(2,'0');
    return `<div class="timeline-row"><span class="timeline-time">${hh} <span style="color:#8B98A0;">${e.icon}</span></span><span class="timeline-text">${e.text}</span></div>`;
  }).join(''):'<div class="empty">Rien de notable détecté aujourd\'hui pour l\'instant.</div>';
  main.insertAdjacentHTML('beforeend',`
    <div class="cal-section">
      <h2>Vue "Aujourd'hui"</h2>
      <p class="hint">Chronologie des événements marquants de la journée.</p>
      <div class="card" style="max-width:480px;">${html}</div>
    </div>
  `);
}

function nightWindow(daysAgo){
  const end=new Date(); end.setHours(7,0,0,0); end.setDate(end.getDate()-daysAgo);
  const start=new Date(end); start.setDate(start.getDate()-1); start.setHours(23,0,0,0);
  return {start,end};
}
function estimateDurationAbove(pts,threshold){
  const sorted=pts.slice().sort((a,b)=>a.t-b.t);
  let totalMs=0;
  for(let i=0;i<sorted.length-1;i++){
    if(sorted[i].v>threshold){
      totalMs+=Math.min(sorted[i+1].t-sorted[i].t,45*60000);
    }
  }
  return totalMs/60000;
}
function nightScoreColor(score){
  if(score>=80)return '#3FAE56';
  if(score>=60)return '#E0B23D';
  if(score>=40)return '#E8A33D';
  return '#D64545';
}
function computeNightStats(daysAgo){
  const {start,end}=nightWindow(daysAgo);
  function seriesIn(metric){return (byRoomMetric['Chambre|'+metric]||[]).filter(p=>p.t>=start&&p.t<end);}
  const temp=seriesIn('Temperature'), hum=seriesIn('Humidity'), co2=seriesIn('CO2'), noise=seriesIn('Noise');
  if(!temp.length&&!co2.length&&!noise.length)return null;
  const avg=arr=>arr.length?arr.reduce((a,p)=>a+p.v,0)/arr.length:null;
  const max=arr=>arr.length?Math.max(...arr.map(p=>p.v)):null;
  const tempAvg=avg(temp), humAvg=avg(hum), co2Avg=avg(co2), co2Max=max(co2), noiseAvg=avg(noise), noiseMax=max(noise);
  const co2Above1000=estimateDurationAbove(co2,1000);
  let score=100;
  if(co2Avg!==null){ if(co2Avg>1500)score-=35; else if(co2Avg>1000)score-=20; else if(co2Avg>800)score-=8; }
  if(co2Max!==null&&co2Max>1500)score-=10;
  if(tempAvg!==null){ if(tempAvg<15||tempAvg>22)score-=15; else if(tempAvg<16||tempAvg>20)score-=6; }
  if(humAvg!==null){ if(humAvg<30||humAvg>70)score-=15; else if(humAvg<40||humAvg>60)score-=6; }
  if(noiseAvg!==null&&noiseAvg>38)score-=10;
  if(noiseMax!==null&&noiseMax>55)score-=6;
  score=Math.max(0,Math.min(100,Math.round(score)));
  return {start,end,score,tempAvg,humAvg,co2Avg,co2Max,noiseAvg,noiseMax,co2Above1000};
}

function detectSolarGainHours(room){
  const tempPts=(byRoomMetric[room+'|Temperature']||[]).slice().sort((a,b)=>a.t-b.t);
  const extPts=byRoomMetric['Extérieur|Temperature']||[];
  const co2Pts=byRoomMetric[room+'|CO2']||[];
  const humPts=byRoomMetric[room+'|Humidity']||[];
  function nearestVal(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return bd<3600000?best:null;
  }
  const hourCounts=new Array(24).fill(0);
  let total=0;
  for(let i=0;i<tempPts.length-1;i++){
    const dtH=(tempPts[i+1].t-tempPts[i].t)/3600000;
    if(dtH<=0||dtH>3.5)continue;
    const dTemp=tempPts[i+1].v-tempPts[i].v;
    if(dTemp<0.8)continue;
    const extA=nearestVal(extPts,tempPts[i].t), extB=nearestVal(extPts,tempPts[i+1].t);
    if(extA===null||extB===null||Math.abs(extB-extA)>1.2)continue;
    const co2A=nearestVal(co2Pts,tempPts[i].t), co2B=nearestVal(co2Pts,tempPts[i+1].t);
    if(co2A!==null&&co2B!==null&&Math.abs(co2B-co2A)>60)continue;
    const humA=nearestVal(humPts,tempPts[i].t), humB=nearestVal(humPts,tempPts[i+1].t);
    if(humA!==null&&humB!==null&&Math.abs(humB-humA)>4)continue;
    hourCounts[tempPts[i].t.getHours()]++;
    total++;
  }
  return {hourCounts,total};
}
function buildSolarGainSection(){
  const rooms=['Séjour','Cuisine','Chambre'];
  const results=rooms.map(r=>({room:r,...detectSolarGainHours(r)})).filter(r=>r.total>=3);
  const main=document.getElementById('mainContent');
  if(!results.length){
    main.insertAdjacentHTML('beforeend','<div class="cal-section"><h2>Apports solaires probables</h2><div class="empty">Pas assez d\'épisodes détectés pour dégager une tendance (montée de température sans hausse extérieure ni activité).</div></div>');
    return;
  }
  const rowsHtml=results.map(r=>{
    const maxCount=Math.max(...r.hourCounts);
    const bars=r.hourCounts.map((c,h)=>{
      const norm=maxCount?c/maxCount:0;
      return `<div style="width:9px;flex-shrink:0;height:24px;display:flex;align-items:flex-end;" title="${h}h : ${c} épisode(s)"><div style="width:100%;height:${Math.max(2,norm*24)}px;background:${c?'#E8A33D':'#20272d'};border-radius:1px;"></div></div>`;
    }).join('');
    let peakH=0; r.hourCounts.forEach((c,h)=>{if(c>r.hourCounts[peakH])peakH=h;});
    return `<div class="card" style="margin-bottom:10px;">
      <div class="room-title">${r.room} <span style="font-weight:400;color:var(--text-muted);font-size:12px;">— surtout vers ${peakH}h (${r.total} épisodes au total)</span></div>
      <div style="display:flex;gap:1px;">${bars}</div>
    </div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend',`
    <div class="cal-section">
      <h2>Apports solaires probables</h2>
      <p class="hint">Détecté quand la température d'une pièce monte sans que l'extérieur, le CO2 ou l'humidité ne bougent significativement — signe d'un réchauffement par le soleil plutôt que par l'activité ou le chauffage.</p>
      <div style="max-width:480px;">${rowsHtml}</div>
    </div>
  `);
}

function computeRecords(rows,year){
  return RECORD_METRICS.map(rm=>{
    const pts=rows.filter(r=>r.module===rm.module&&r.metric===rm.metric&&(year==='all'||new Date(r.timestamp_utc).getFullYear()===year));
    if(!pts.length)return {...rm,value:null,date:null};
    let best=pts[0];
    pts.forEach(p=>{
      if(rm.agg==='max'&&p.value>best.value)best=p;
      if(rm.agg==='min'&&p.value<best.value)best=p;
    });
    return {...rm,value:best.value,date:new Date(best.timestamp_utc),ts:best.timestamp_utc};
  });
}
function computeAllTimeTop3(rows,rm){

}
