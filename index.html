function computeTimeInZone(room,metric,bucketSize,rangeStart,rangeEnd){
  const pts=(byRoomMetric[room+'|'+metric]||[]).filter(p=>p.t>=rangeStart&&p.t<rangeEnd).sort((a,b)=>a.t-b.t);
  const buckets={};
  for(let i=0;i<pts.length-1;i++){
    const dt=(pts[i+1].t-pts[i].t)/60000;
    if(dt<=0||dt>180)continue;
    const b=Math.floor(pts[i].v/bucketSize)*bucketSize;
    buckets[b]=(buckets[b]||0)+dt;
  }
  return buckets;
}
function tempZoneColor(bucketCenter){
  const lo=10, mid=19.5, hi=30;
  if(bucketCenter<=mid){
    const t=Math.max(0,Math.min(1,(bucketCenter-lo)/(mid-lo)));
    return mix3([62,124,214],[232,236,238],t);
  }
  const t=Math.max(0,Math.min(1,(bucketCenter-mid)/(hi-mid)));
  return mix3([232,236,238],[214,69,69],t);
}

    wrap.innerHTML=html||'<div class="empty">Pas assez de données sur cette période.</div>';
  }
  document.querySelectorAll('#zoneTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#zoneTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.r);
    });
  });
  document.querySelector('#zoneTabs button[data-r="day"]').classList.add('active');
  render('day');
}

function buildDashboard(rows){
  byRoomMetric={};
  rows.forEach(r=>{
    const key=r.module+'|'+r.metric;
    if(!byRoomMetric[key])byRoomMetric[key]=[];
    byRoomMetric[key].push({t:new Date(r.timestamp_utc),v:r.value});
  });

  const rooms=[...new Set(rows.map(r=>r.module))].filter(r=>r!=='Anémomètre');
  function colorFor(room){return ROOM_COLOR[room]||EXT_COLOR;}

  const main=document.getElementById('mainContent');
  main.innerHTML=`
    <h2>Température</h2>
    <div class="tabs" id="rangeTabs">
      <button data-r="day">Jour</button><button data-r="week">Semaine</button>
      <button data-r="month">Mois</button><button data-r="season">Saison</button><button data-r="year">Année</button>
    </div>
    <p class="hint">Molette ou pincement pour zoomer, glisser pour vous déplacer dans le temps.</p>
    <div class="legend" id="legend"></div>
    <div class="chartbox">${chartWrap('tempChart','°C')}</div>
    <h2>Extérieur vs Séjour</h2>
    <div class="legend"><span><span class="dot" style="background:#E8ECEE"></span>Séjour</span><span><span class="dot" style="background:#D64545"></span>Extérieur plus chaud</span><span><span class="dot" style="background:#3E7CD6"></span>Extérieur plus froid</span></div>
    <p class="hint" id="tempCompareCaption"></p>
    <div class="chartbox" style="height:320px;">${chartWrap('tempCompareChart','°C')}</div>
    <h2>Humidité</h2>
    <div class="chartbox">${chartWrap('humChart','%')}</div>
    <h2>CO2</h2>
    <div class="chartbox">${chartWrap('co2Chart','ppm')}</div>
    <h2>Pression</h2>
    <div class="legend"><span><span class="dot" style="background:#8B98A0"></span>Stable</span><span><span class="dot" style="background:#E8A33D"></span>Évolution modérée</span><span><span class="dot" style="background:#D64545"></span>Chute rapide</span><span><span class="dot" style="background:#3E7CD6"></span>Remontée rapide</span></div>
    <div class="chartbox">${chartWrap('pressureChart','hPa')}</div>
    <h2>Bruit — Séjour &amp; Chambre</h2>
    <div class="chartbox">${chartWrap('noiseChart','dB')}</div>
    <h2>Confort intérieur</h2>
    <p class="hint">Moyennes sur la période sélectionnée (trait plein) vs période précédente équivalente (pointillé).</p>
    <div class="chartbox" style="max-width:420px;height:380px;"><canvas id="comfortRadarChart"></canvas></div>
    <h2>Vent</h2>
    <div id="windRoseSlot"></div>
    <div class="legend"><span><span class="dot" style="background:#E8ECEE"></span>Moyenne</span><span><span class="dash"></span>Rafale</span><span><span class="dot" style="background:#E8A33D"></span>Fort</span><span><span class="dot" style="background:#D64545"></span>Très fort</span></div>
    <p class="hint">Les petites flèches indiquent la direction du vent vers laquelle il souffle.</p>
    <div class="chartbox">${chartWrap('windChart','km/h')}</div>
    <h2>À quelle heure ça monte / ça descend ?</h2>
    <p class="insight-caption" id="riseFallCaption"></p>
    <div class="chartbox small" id="riseFallCanvasWrap"></div>
    <h2>Aujourd'hui vs jours précédents — Extérieur</h2>
    <div class="chartbox" id="dayOverlayCanvasWrap"></div>
    <div id="minmaxSlot"></div>
  `;

  const legend=document.getElementById('legend');
  rooms.forEach(r=>{
    const el=document.createElement('span');
    el.innerHTML=`<span class="dot" style="background:${colorFor(r)}"></span>${r}`;
    legend.appendChild(el);
  });

  function seriesFor(metric,rangeDays){
    const aggregated=rangeDays>7;
    const rawWindowCutoff=new Date(Date.now()-60*86400000);
    return rooms.map(room=>{
      const key=room+'|'+metric;
      let pts=byRoomMetric[key]||[];
      if(aggregated)pts=aggregateDaily(pts,'avg');
      else pts=pts.filter(p=>p.t>=rawWindowCutoff);
      return {label:room,data:pts.map(p=>({x:p.t,y:p.v})),borderColor:colorFor(room),backgroundColor:colorFor(room),borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42};
    }).filter(s=>s.data.length>0);
  }
  function seriesForWindow(metric,minMs,maxMs){
    const windowDays=(maxMs-minMs)/86400000;
    const aggregated=windowDays>7;
    const pad=(maxMs-minMs)*0.3;
    const lo=minMs-pad, hi=maxMs+pad;
    return rooms.map(room=>{
      const key=room+'|'+metric;
      let pts=(byRoomMetric[key]||[]).filter(p=>p.t.getTime()>=lo&&p.t.getTime()<=hi);
      if(aggregated)pts=aggregateDaily(pts,'avg');
      return {label:room,data:pts.map(p=>({x:p.t,y:p.v})),borderColor:colorFor(room),backgroundColor:colorFor(room),borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42};
    }).filter(s=>s.data.length>0);
  }

  let charts={};
  function makeChart(id,metric,unit,rangeDays){
    if(charts[id])charts[id].destroy();
    charts[id]=new Chart(document.getElementById(id),{
      type:'line',
      data:{datasets:seriesFor(metric,rangeDays)},
      options:{
        responsive:true,maintainAspectRatio:false,
        interaction:{mode:'xNearest',intersect:false},
      elements:{point:{hoverRadius:0,radius:0}},
      animation:false,
      hover:{animationDuration:0},
      responsiveAnimationDuration:0,
        plugins:{legend:{display:false},zoom:ZOOM_OPTS,tooltip:{position:'nearest',enabled:true,callbacks:{title:tooltipTitle24,label:(ctx)=>(ctx.dataset.label||'')+': '+ctx.parsed.y+unit}}},
        scales:{x:Object.assign(timeAxisForRange(rangeDays),{min:new Date(Date.now()-rangeDays*86400000),max:new Date()}),
                y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}
      }
    });
    charts[id]._rebuildForWindow=(minMs,maxMs)=>{
      charts[id].data.datasets=seriesForWindow(metric,minMs,maxMs);
    };
  }

  const rangeDays={day:1,week:7,month:30,season:90,year:365};
  function render(range){
    const d=rangeDays[range];
    syncedCharts=[];
    makeChart('tempChart','Temperature','°C',d);
    makeChart('humChart','Humidity','%',d);
    makeChart('co2Chart','CO2',' ppm',d);
    makeChart('noiseChart','Noise',' dB',d);
    if(charts['pressureChart'])charts['pressureChart'].destroy();
    charts['pressureChart']=buildPressureChart(d);
    if(charts['tempCompareChart'])charts['tempCompareChart'].destroy();
    charts['tempCompareChart']=buildTempCompareChart(d);
    if(charts['windChart'])charts['windChart'].destroy();
    charts['windChart']=buildWindChart(d);
    buildWindRoses(d);
    if(charts['comfortRadar'])charts['comfortRadar'].destroy();
    charts['comfortRadar']=buildComfortRadar(d);
    syncedCharts=Object.values(charts).filter(Boolean);
    buildRiseFallChart(d);
    buildDayOverlayChart(d);
  }
  document.querySelectorAll('#rangeTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#rangeTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');render(b.dataset.r);
    });
  });
  document.querySelector('#rangeTabs button[data-r="week"]').classList.add('active');
  render('week');
  buildDailyMinMaxChart(rows);
  buildWeeklyProfileHeatmap(rows);
  buildTodayTimeline();
  buildNightScores();
  buildTimeInZoneSection();
  buildCalendarSection(rows);
  buildRecordsSection(rows);
}

async function init(){
  let latest=null, rows=[];
  try{ latest=await fetchJSON('data/latest.json'); }catch(e){}
  try{
    const text=await fetchText('data/history.csv');
    if(text.trim()){
      const parsed=Papa.parse(text,{header:true,dynamicTyping:true,skipEmptyLines:true});
      rows=parsed.data;
      byRoomMetric={};
      rows.forEach(r=>{
        const key=r.module+'|'+r.metric;
        if(!byRoomMetric[key])byRoomMetric[key]=[];
        byRoomMetric[key].push({t:new Date(r.timestamp_utc),v:r.value});
      });
    }
  }catch(e){}

  if(latest){
    renderCards(latest);
  }else{
    document.getElementById('lastUpdate').textContent="Pas encore de données — le premier relevé Netatmo n'a pas encore été collecté.";
  }

  if(rows.length){
    try{
      buildDashboard(rows);
    }catch(e){
      document.getElementById('mainContent').innerHTML='<div class="empty">Une erreur est survenue.<br><span style="font-size:11px;">'+e.message+'</span></div>';
    }
  }else{
    document.getElementById('mainContent').innerHTML='<div class="empty">Pas encore d\'historique à afficher.</div>';
  }
}
init();
</script>
</body>
</html>
