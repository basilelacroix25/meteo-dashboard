<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station météo — B3D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1418">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1418; --panel:#161D22; --panel-2:#1B2329; --border:#262F35;
  --text:#E8ECEE; --text-muted:#8B98A0;
  --sejour:#3E7CD6; --cuisine:#3FAE56; --chambre:#D64545; --ext:#B8C0C6;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;line-height:1.5;}
.wrap{max-width:1000px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
header{margin-bottom:2rem;}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:2rem;margin:0 0 4px;}
.sub{color:var(--text-muted);font-size:14px;}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;margin:2.5rem 0 1rem;}
.hint{font-size:12px;color:var(--text-muted);margin:-8px 0 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:1rem;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.room-title{font-size:14px;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:7px;font-weight:500;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.metric-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--border);font-size:13px;}
.metric-row:first-of-type{border-top:none;}
.metric-label{color:var(--text-muted);flex:1;}
.metric-value{font-family:'JetBrains Mono',monospace;font-size:14px;white-space:nowrap;}
.pastille{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:8px;flex-shrink:0;}
.trend{display:inline-block;width:16px;text-align:center;margin-left:6px;color:var(--text-muted);flex-shrink:0;}
.trend.up{color:#D64545;}
.trend.down{color:#3E7CD6;}
.minmax-italic{font-style:italic;font-size:11px;color:var(--text-muted);margin:-3px 0 4px;}
.ext-card .wind-block{display:flex;align-items:center;gap:14px;margin-top:8px;border-top:1px solid var(--border);padding-top:10px;}
.rose-combo{width:96px;height:96px;flex-shrink:0;}
.wind-text{font-size:12px;color:var(--text-muted);}
.wind-text .dir{color:var(--text);font-weight:600;font-size:14px;display:block;margin-bottom:4px;}
.wind-text b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.tabs button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Work Sans',sans-serif;}
.tabs button.active{background:var(--panel-2);border-color:var(--text-muted);}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .dash{width:16px;height:0;border-top:2px dashed var(--text-muted);display:inline-block;}
.chartbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;height:250px;position:relative;margin-bottom:1.5rem;display:flex;flex-direction:column;}
.chartbox.small{height:190px;}
.axis-label{font-size:11px;color:var(--text-muted);margin:0 0 6px;flex:0 0 auto;}
.canvas-fill{position:relative;flex:1;min-height:0;}
.canvas-fill canvas,.chartbox canvas{touch-action:none;}
.barwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:1.5rem;height:290px;position:relative;}
.rosewrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:1.5rem;height:260px;position:relative;max-width:320px;}
.cal-section{margin-top:2rem;}
.aeration-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem;}
.aeration-card{border-radius:10px;padding:14px;border:1px solid var(--border);}
.aeration-card.green{background:rgba(63,174,86,0.10);border-color:rgba(63,174,86,0.4);}
.aeration-card.orange{background:rgba(224,178,61,0.10);border-color:rgba(224,178,61,0.4);}
.aeration-card.red{background:rgba(214,69,69,0.10);border-color:rgba(214,69,69,0.4);}
.aeration-title{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.aeration-detail{font-size:11px;color:var(--text-muted);line-height:1.6;}
.aeration-detected{font-size:11px;color:#3FAE56;margin-top:6px;}
.cal-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.cal-row .month-label{width:74px;font-size:11px;color:var(--text-muted);flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.cal-row .days{display:flex;gap:2px;flex:1;flex-wrap:nowrap;}
.cal-day{width:9px;height:16px;border-radius:2px;background:#20272d;flex-shrink:0;}
.empty{background:var(--panel);border:1px dashed var(--border);border-radius:10px;padding:2rem;text-align:center;color:var(--text-muted);}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);margin-top:8px;}
.grad{width:90px;height:8px;border-radius:4px;}
.insight-caption{font-size:13px;color:var(--text);margin:0 0 10px;}
.insight-caption b{font-family:'JetBrains Mono',monospace;font-weight:500;}
footer{margin-top:3rem;color:var(--text-muted);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Station météo</h1>
  <p class="sub" id="lastUpdate">En attente des premières données…</p>
</header>

<div class="cards" id="liveCards"></div>

<div id="aerationPanel"></div>

<div id="mainContent"></div>

<footer>Séjour = base station · Chambre = Home Coach · Cuisine = module intérieur additionnel · Extérieur &amp; Anémomètre = modules extérieurs. Données collectées toutes les 15 min via l'API Netatmo. Vent : direction affichée = d'où souffle le vent.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script>
const ROOM_COLOR={'Séjour':'#3E7CD6','Cuisine':'#3FAE56','Chambre':'#D64545'};
const EXT_COLOR='#B8C0C6';
const METRIC_ORDER=['Temperature','Humidity','CO2','Noise'];
const METRIC_LABEL={Temperature:'Température',Humidity:'Humidité',CO2:'CO2',Noise:'Bruit',Pressure:'Pression'};
const METRIC_UNIT={Temperature:'°C',Humidity:'%',CO2:' ppm',Noise:' dB',Pressure:' hPa'};
const METRIC_DECIMALS={Temperature:1,Humidity:0,CO2:0,Noise:0,Pressure:1};
const TOLERANCE={
  Temperature:{idealLo:18,idealHi:24,hardLo:14,hardHi:29},
  Humidity:{idealLo:40,idealHi:60,hardLo:20,hardHi:80},
  CO2:{idealLo:0,idealHi:800,hardLo:0,hardHi:1500},
  Noise:{idealLo:0,idealHi:45,hardLo:0,hardHi:70}
};
const TREND_EPS={Temperature:0.2,Humidity:2,CO2:20,Noise:2,Pressure:0.5,WindStrength:2};
const COMPASS16=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];

// chartjs-plugin-zoom s'enregistre automatiquement via son build UMD.
let syncedCharts=[];
const DETAIL_POINT_THRESHOLD=80;
function adjustTension(chart){
  const xs=chart.scales&&chart.scales.x;
  if(!xs)return;
  chart.data.datasets.forEach(ds=>{
    if(ds._baseTension===undefined)return;
    const xMin=xs.min instanceof Date?xs.min.getTime():xs.min;
    const xMax=xs.max instanceof Date?xs.max.getTime():xs.max;
    const visible=ds.data.filter(p=>{
      const x=p.x instanceof Date?p.x.getTime():(p.x&&p.x.getTime?p.x.getTime():p.x);
      return x>=xMin&&x<=xMax;
    }).length;
    ds.tension = visible>DETAIL_POINT_THRESHOLD ? ds._baseTension : 0;
  });
}
function syncZoomPan(sourceChart){
  const xs=sourceChart.scales.x;
  if(!xs)return;
  adjustTension(sourceChart);
  sourceChart.update('none');
  syncedCharts.forEach(c=>{
    if(c===sourceChart||c.destroyed)return;
    c.options.scales.x.min=xs.min;
    c.options.scales.x.max=xs.max;
    adjustTension(c);
    c.update('none');
  });
}
const ZOOM_OPTS={
  pan:{enabled:true,mode:'x',onPanComplete:({chart})=>syncZoomPan(chart)},
  zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x',onZoomComplete:({chart})=>syncZoomPan(chart)}
};
const crosshairPlugin={
  id:'crosshair',
  afterDraw(chart){
    if(chart.config.type!=='line')return;
    const active=chart.getActiveElements&&chart.getActiveElements();
    if(!active||!active.length)return;
    const x=active[0].element.x;
    const {ctx,chartArea}=chart;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x,chartArea.top);
    ctx.lineTo(x,chartArea.bottom);
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(232,236,238,0.35)';
    ctx.stroke();
    ctx.restore();
  }
};
if(window.Chart){ Chart.register(crosshairPlugin); }

function mix3(a,b,k){return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';}
function gradientColor(t){
  const green=[63,174,86], yellow=[224,178,61], red=[214,69,69];
  if(t<0.5)return mix3(green,yellow,t/0.5);
  return mix3(yellow,red,(t-0.5)/0.5);
}
function pastilleColor(metric,value){
  const r=TOLERANCE[metric];
  if(!r||value===undefined||value===null)return null;
  let badness=0;
  if(value<r.idealLo)badness=(r.idealLo-value)/(r.idealLo-r.hardLo||1);
  else if(value>r.idealHi)badness=(value-r.idealHi)/(r.hardHi-r.idealHi||1);
  return gradientColor(Math.max(0,Math.min(1,badness)));
}
function compassLabel(angle){
  const idx=Math.round(((angle%360)+360)%360/22.5)%16;
  return COMPASS16[idx];
}
function fmt24(d){
  return d.toLocaleString('fr-FR',{hour12:false,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function timeAxis(){
  return {type:'time',
    time:{displayFormats:{minute:'HH:mm',hour:'HH:mm',day:'dd/MM',week:'dd/MM',month:'MM/yyyy',quarter:'MM/yyyy',year:'yyyy'},tooltipFormat:'dd/MM HH:mm'},
    ticks:{color:'#8B98A0'},grid:{color:'#262F35'}};
}
function tooltipTitle24(items){
  return items.length?fmt24(new Date(items[0].parsed.x)):'';
}
function mix(hexA,hexB,t){
  const pa=hexA.match(/\w\w/g).map(x=>parseInt(x,16));
  const pb=hexB.match(/\w\w/g).map(x=>parseInt(x,16));
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return 'rgb('+c.join(',')+')';
}

let byRoomMetric={};

function trendFor(module,metric){
  const pts=byRoomMetric[module+'|'+metric];
  if(!pts||pts.length<2)return {arrow:'→',cls:'flat'};
  const cutoff=new Date(Date.now()-65*60000);
  const recent=pts.filter(p=>p.t>=cutoff);
  if(recent.length<2)return {arrow:'→',cls:'flat'};
  const first=recent[0].v, last=recent[recent.length-1].v;
  const eps=TREND_EPS[metric]||0.5;
  if(last-first>eps)return {arrow:'↑',cls:'up'};
  if(first-last>eps)return {arrow:'↓',cls:'down'};
  return {arrow:'→',cls:'flat'};
}

function todayMinMax(module,metric){
  const today=new Date().toISOString().slice(0,10);
  const vals=(byRoomMetric[module+'|'+metric]||[]).filter(p=>p.t.toISOString().slice(0,10)===today).map(p=>p.v);
  if(!vals.length)return null;
  return {min:Math.min(...vals),max:Math.max(...vals)};
}

function tempFooterLine(module,temp,hum){
  const mm=todayMinMax(module,'Temperature');
  const parts=[];
  if(mm)parts.push(`min ${mm.min.toFixed(1)}° · max ${mm.max.toFixed(1)}°`);
  const dp=dewPoint(temp,hum);
  if(dp!==null){
    const gap=temp-dp;
    let style='';
    if(gap<=0)style='color:#D64545;';
    else if(gap<=3)style='color:#E8A33D;';
    parts.push(`<span style="${style}">rosée ${dp.toFixed(1)}°</span>`);
  }
  return parts.length?`<p class="minmax-italic">${parts.join(' · ')}</p>`:'';
}
function metricRow(module,metric,value,noPastille,humForDew){
  const unit=METRIC_UNIT[metric]||'';
  const dec=METRIC_DECIMALS[metric]!==undefined?METRIC_DECIMALS[metric]:1;
  const displayVal=(typeof value==='number')?value.toFixed(dec):value;
  const past=noPastille?null:pastilleColor(metric,value);
  const tr=trendFor(module,metric);
  let extra='';
  if(metric==='Temperature'){
    extra=tempFooterLine(module,value,humForDew);
  }
  return `<div class="metric-row">
    <span class="metric-label">${METRIC_LABEL[metric]||metric}</span>
    <span class="metric-value">${displayVal}${unit}</span>
    ${past?`<span class="pastille" style="background:${past}"></span>`:''}
    <span class="trend ${tr.cls}">${tr.arrow}</span>
  </div>${extra}`;
}
function metricRowNoAuto(metric,value){
  const unit=METRIC_UNIT[metric]||'';
  const dec=METRIC_DECIMALS[metric]!==undefined?METRIC_DECIMALS[metric]:1;
  const displayVal=(typeof value==='number')?value.toFixed(dec):value;
  return `<div class="metric-row">
    <span class="metric-label">${METRIC_LABEL[metric]||metric}</span>
    <span class="metric-value">${displayVal}${unit}</span>
  </div>`;
}

function polarPoint(cx,cy,r,angleDeg){
  const rad=angleDeg*Math.PI/180;
  return [cx+r*Math.sin(rad), cy-r*Math.cos(rad)];
}
function wedgePath(cx,cy,rInner,rOuter,a0,a1){
  const [x1,y1]=polarPoint(cx,cy,rOuter,a0);
  const [x2,y2]=polarPoint(cx,cy,rOuter,a1);
  if(rInner<=0.5){
    return `M${cx},${cy} L${x1},${y1} A${rOuter},${rOuter} 0 0 1 ${x2},${y2} Z`;
  }
  const [x3,y3]=polarPoint(cx,cy,rInner,a1);
  const [x4,y4]=polarPoint(cx,cy,rInner,a0);
  return `M${x4},${y4} L${x1},${y1} A${rOuter},${rOuter} 0 0 1 ${x2},${y2} L${x3},${y3} A${rInner},${rInner} 0 0 0 ${x4},${y4} Z`;
}
// Rose des vents dessinée à la main en SVG : chaque secteur est centré
// exactement sur son point cardinal (secteur i va de angle_i - demi-pas à
// angle_i + demi-pas), donc pas d'ambiguïté d'alignement possible.
function buildRoseSVG(values,n,size,opts){
  opts=opts||{};
  const cx=size/2, cy=size/2;
  const margin=opts.margin!==undefined?opts.margin:18;
  const maxR=size/2-margin;
  const vmax=Math.max(...values,0.001);
  const step=360/n;
  let bars='';
  for(let i=0;i<n;i++){
    const angle=i*step;
    const a0=angle-step/2, a1=angle+step/2;
    const r=Math.max(2,(values[i]/vmax)*maxR);
    const clickAttr=opts.captionId?` onclick="handleRoseClick(this)" data-dir="${compassLabel(angle)}" data-value="${values[i]}" data-caption="${opts.captionId}" style="cursor:pointer"`:'';
    bars+=`<path d="${wedgePath(cx,cy,0,r,a0,a1)}" fill="rgba(184,192,198,0.55)" stroke="#E8ECEE" stroke-width="0.6"${clickAttr}><title>${compassLabel(angle)} : ${values[i]} km/h</title></path>`;
  }
  let grids='';
  if(opts.grid!==false){
    [0.33,0.66,1].forEach(f=>{
      grids+=`<circle cx="${cx}" cy="${cy}" r="${maxR*f}" fill="none" stroke="#262F35" stroke-width="1"/>`;
    });
  }
  let labels='';
  if(opts.labels!==false){
    [['N',0],['E',90],['S',180],['O',270]].forEach(([txt,ang])=>{
      const [lx,ly]=polarPoint(cx,cy,maxR+11,ang);
      labels+=`<text x="${lx}" y="${ly+4}" fill="#B8C0C6" font-size="11" font-weight="600" text-anchor="middle">${txt}</text>`;
    });
  }
  let arrow='';
  if(opts.arrowAngle!==undefined&&opts.arrowAngle!==null){
    const goingTo=(opts.arrowAngle+180)%360;
    const [tx,ty]=polarPoint(cx,cy,maxR*0.92,goingTo);
    const [bx,by]=polarPoint(cx,cy,maxR*0.35,goingTo+180);
    arrow=`<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="#E8ECEE" stroke-width="2.5" stroke-linecap="round"/>`;
    const tip=polarPoint(cx,cy,maxR*0.98,goingTo);
    const wingL=polarPoint(cx,cy,maxR*0.78,goingTo-9);
    const wingR=polarPoint(cx,cy,maxR*0.78,goingTo+9);
    arrow+=`<polygon points="${tip[0]},${tip[1]} ${wingL[0]},${wingL[1]} ${wingR[0]},${wingR[1]}" fill="#E8ECEE"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grids}${bars}${arrow}${labels}</svg>`;
}

function handleRoseClick(el){
  const dir=el.getAttribute('data-dir');
  const val=el.getAttribute('data-value');
  const capId=el.getAttribute('data-caption');
  const suffix=el.hasAttribute('data-suffix')?el.getAttribute('data-suffix'):' km/h';
  const cap=capId&&document.getElementById(capId);
  if(cap)cap.innerHTML=`<b>${dir}</b> : <b>${val}${suffix}</b>`;
}

async function fetchJSON(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('fetch failed: '+url);
  return res.json();
}
async function fetchText(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('fetch failed: '+url);
  return res.text();
}

function computeWindBins(anglePts,speedPts,nDirs){
  // WindAngle Netatmo = direction d'où souffle le vent (convention météo standard) : pas de conversion.
  const sums=new Array(nDirs).fill(0), counts=new Array(nDirs).fill(0);
  const step=360/nDirs;
  anglePts.forEach(p=>{
    const from=((p.v%360)+360)%360;
    const idx=Math.round(from/step)%nDirs;
    let best=null,bestDiff=Infinity;
    speedPts.forEach(sp=>{const diff=Math.abs(sp.t-p.t);if(diff<bestDiff){bestDiff=diff;best=sp.v;}});
    if(best!==null){sums[idx]+=best;counts[idx]++;}
  });
  return sums.map((s,i)=>counts[i]?Math.round((s/counts[i])*10)/10:0);
}

function pressureTrend(){
  const pts=(byRoomMetric['Séjour|Pressure']||[]).filter(p=>p.t>=new Date(Date.now()-3*3600000)).sort((a,b)=>a.t-b.t);
  if(pts.length<2)return null;
  const dtH=(pts[pts.length-1].t-pts[0].t)/3600000;
  if(dtH<=0)return null;
  return (pts[pts.length-1].v-pts[0].v)/dtH;
}
function pressureBadge(rate){
  if(rate===null)return {text:'Tendance inconnue',color:'#8B98A0'};
  if(rate<=-1)return {text:'Chute rapide — coup de vent possible',color:'#D64545'};
  if(rate<=-0.3)return {text:'En baisse',color:'#E8A33D'};
  if(rate>=1)return {text:'Remontée rapide',color:'#3E7CD6'};
  if(rate>=0.3)return {text:'En hausse',color:'#3E7CD6'};
  return {text:'Stable',color:'#8B98A0'};
}
function pressureColor(rate){
  if(rate<=-1)return '#D64545';
  if(rate>=1)return '#3E7CD6';
  if(Math.abs(rate)<0.3)return '#8B98A0';
  return '#E8A33D';
}

function dewPoint(tempC,rh){
  if(tempC===undefined||rh===undefined||tempC===null||rh===null)return null;
  const a=17.27,b=237.7;
  const alpha=((a*tempC)/(b+tempC))+Math.log(rh/100);
  return (b*alpha)/(a-alpha);
}


function aerationVerdict(co2,hum){
  let level=0;
  if((co2!==undefined&&co2>1200)||(hum!==undefined&&hum>70))level=2;
  else if((co2!==undefined&&co2>800)||(hum!==undefined&&hum>60))level=1;
  return level;
}
function detectRecentAeration(room){
  const pts=(byRoomMetric[room+'|CO2']||[]).filter(p=>p.t>=new Date(Date.now()-6*3600000)).sort((a,b)=>a.t-b.t);
  if(pts.length<3)return null;
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dtMin=(pts[j].t-pts[i].t)/60000;
      if(dtMin>60)break;
      if(pts[i].v-pts[j].v>=300){
        return {from:pts[i].v,to:pts[j].v,durationMin:Math.round(dtMin)};
      }
    }
  }
  return null;
}
function buildAerationPanel(rooms){
  const wrap=document.getElementById('aerationPanel');
  if(!wrap)return;

function compassGlowSVG(fromAngle,size,arrowAngle){
  const cx=size/2, cy=size/2;
  const rOuter=size/2-8, rInner=rOuter-10;
  let glow='';
  if(fromAngle!==undefined&&fromAngle!==null){
    const spread=55, steps=11;
    for(let i=0;i<steps;i++){
      const off=(i/(steps-1)-0.5)*spread;
      const a0=fromAngle+off-2.8, a1=fromAngle+off+2.8;
      const dist=Math.abs(off)/(spread/2);
      const opacity=Math.max(0,0.5*(1-dist*dist));
      glow+=`<path d="${wedgePath(cx,cy,rInner,rOuter,a0,a1)}" fill="rgba(232,236,238,${opacity.toFixed(2)})"/>`;
    }
  }
  const ring=`<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="#262F35" stroke-width="1.5"/>
              <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="#262F35" stroke-width="1"/>`;
  const dots=[0,90,180,270].map(a=>{const [x,y]=polarPoint(cx,cy,rOuter+9,a); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="#8B98A0"/>`;}).join('');
  const [nx,ny]=polarPoint(cx,cy,rOuter+9,0);
  const nLabel=`<text x="${nx.toFixed(1)}" y="${(ny-4).toFixed(1)}" fill="#8B98A0" font-size="9" font-weight="600" text-anchor="middle">N</text>`;
  let arrow='';
  if(arrowAngle!==undefined&&arrowAngle!==null){
    const goingTo=(arrowAngle+180)%360;
    const [tx,ty]=polarPoint(cx,cy,rInner*0.9,goingTo);
    const [bx,by]=polarPoint(cx,cy,rInner*0.3,goingTo+180);
    arrow=`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#E8ECEE" stroke-width="2.5" stroke-linecap="round"/>`;
    const tip=polarPoint(cx,cy,rInner*0.95,goingTo);
    const wingL=polarPoint(cx,cy,rInner*0.68,goingTo-11);
    const wingR=polarPoint(cx,cy,rInner*0.68,goingTo+11);
    arrow+=`<polygon points="${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${wingL[0].toFixed(1)},${wingL[1].toFixed(1)} ${wingR[0].toFixed(1)},${wingR[1].toFixed(1)}" fill="#E8ECEE"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${ring}${glow}${arrow}${dots}${nLabel}</svg>`;
}

const WEATHER_ICON_CACHE={};
async function fetchWeatherIcons(days){
  if(!days.length)return {};
  const start=days[0], end=days[days.length-1];
  const cacheKey=start+'_'+end;
  if(WEATHER_ICON_CACHE[cacheKey])return WEATHER_ICON_CACHE[cacheKey];
  try{
    const url=`https://archive-api.open-meteo.com/v1/archive?latitude=47.247&longitude=6.028&start_date=${start}&end_date=${end}&daily=weathercode&timezone=Europe%2FParis`;
    const res=await fetch(url);
    const j=await res.json();
    const map={};
    (j.daily?.time||[]).forEach((d,i)=>{map[d]=j.daily.weathercode[i];});
    WEATHER_ICON_CACHE[cacheKey]=map;
    return map;
  }catch(e){return {};}
}
function weatherCategory(code){
  if(code===undefined||code===null)return null;
  if(code===0)return 'sun';
  if([1,2].includes(code))return 'partly';
  if(code===3)return 'cloud';
  if([45,48].includes(code))return 'fog';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return 'rain';
  if([71,73,75,77,85,86].includes(code))return 'snow';
  if([95,96,99].includes(code))return 'storm';
  return null;
}
function drawWeatherIcon(ctx,category,cx,cy,s,color){
  if(!category)return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.lineJoin='round';
  function cloud(ox,oy,scale){
    ctx.beginPath();
    ctx.arc(ox-0.35*scale,oy,0.32*scale,Math.PI*0.5,Math.PI*1.6);
    ctx.arc(ox+0.05*scale,oy-0.22*scale,0.28*scale,Math.PI*1.1,Math.PI*2.05);
    ctx.arc(ox+0.42*scale,oy,0.30*scale,Math.PI*1.4,Math.PI*0.55);
    ctx.closePath();
    ctx.stroke();
  }
  if(category==='sun'){
    ctx.beginPath(); ctx.arc(cx,cy,s*0.28,0,Math.PI*2); ctx.stroke();
    for(let a=0;a<8;a++){
      const ang=a*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*s*0.42, cy+Math.sin(ang)*s*0.42);
      ctx.lineTo(cx+Math.cos(ang)*s*0.56, cy+Math.sin(ang)*s*0.56);
      ctx.stroke();
    }
  }else if(category==='partly'){
    ctx.beginPath(); ctx.arc(cx-s*0.15,cy-s*0.18,s*0.2,0,Math.PI*2); ctx.stroke();
    cloud(cx+s*0.05,cy+s*0.12,s*0.85);
  }else if(category==='cloud'||category==='fog'){
    cloud(cx,cy,s*0.95);
    if(category==='fog'){
      [0.2,0.34].forEach(o=>{ ctx.beginPath(); ctx.moveTo(cx-s*0.32,cy+s*o); ctx.lineTo(cx+s*0.32,cy+s*o); ctx.stroke(); });
    }
  }else if(category==='rain'){
    cloud(cx,cy-s*0.08,s*0.85);
    [-0.2,0,0.2].forEach(o=>{ ctx.beginPath(); ctx.moveTo(cx+o*s,cy+s*0.26); ctx.lineTo(cx+o*s-s*0.05,cy+s*0.42); ctx.stroke(); });
  }else if(category==='snow'){
    cloud(cx,cy-s*0.08,s*0.85);
    [-0.2,0,0.2].forEach(o=>{ ctx.beginPath(); ctx.arc(cx+o*s,cy+s*0.34,s*0.035,0,Math.PI*2); ctx.fill(); });
  }else if(category==='storm'){
    cloud(cx,cy-s*0.1,s*0.85);
    ctx.beginPath();
    ctx.moveTo(cx+s*0.02,cy+s*0.18);
    ctx.lineTo(cx-s*0.08,cy+s*0.36);
    ctx.lineTo(cx+s*0.03,cy+s*0.36);
    ctx.lineTo(cx-s*0.05,cy+s*0.54);
    ctx.stroke();
  }
  ctx.restore();
}

function detectWindOnsets(afterH){
  const anglePts=(byRoomMetric['Anémomètre|WindAngle']||[]).slice().sort((a,b)=>a.t-b.t);
  const speedPts=(byRoomMetric['Anémomètre|WindStrength']||[]).slice().sort((a,b)=>a.t-b.t);
  const tempPts=(byRoomMetric['Extérieur|Temperature']||[]).slice().sort((a,b)=>a.t-b.t);
  const humPts=(byRoomMetric['Extérieur|Humidity']||[]).slice().sort((a,b)=>a.t-b.t);
  function nearestVal(pts,t,maxDiffH){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    if(bd>maxDiffH*3600000)return null;
    return best;
  }
  const CALM=8, BLOWING=15;
  let wasCalm=true;
  const onsets=[];
  speedPts.forEach(p=>{
    if(p.v<CALM)wasCalm=true;
    else if(p.v>=BLOWING&&wasCalm){ onsets.push(p.t); wasCalm=false; }
  });
  const results=[];
  onsets.forEach(t=>{
    const angle=nearestVal(anglePts,t,1);
    if(angle===null)return;
    const tBefore=new Date(t.getTime()-30*60000), tAfter=new Date(t.getTime()+afterH*3600000);
    const tempBefore=nearestVal(tempPts,tBefore,1), tempAfter=nearestVal(tempPts,tAfter,1);
    const humBefore=nearestVal(humPts,tBefore,1), humAfter=nearestVal(humPts,tAfter,1);
    if(tempBefore===null||tempAfter===null)return;
    results.push({angle,dTemp:tempAfter-tempBefore,dHum:(humBefore!==null&&humAfter!==null)?humAfter-humBefore:null});
  });
  return results;
}

function buildDivergingRoseSVG(values,n,size,opts){
  opts=opts||{};
  const cx=size/2, cy=size/2;
  const margin=opts.margin!==undefined?opts.margin:18;
  const maxR=size/2-margin;
  const known=values.filter(v=>v!==null);
  const maxAbs=Math.max(...known.map(v=>Math.abs(v)),0.001);
  const step=360/n;
  let bars='';
  for(let i=0;i<n;i++){
    const v=values[i];
    const angle=i*step;
    const a0=angle-step/2, a1=angle+step/2;
    if(v===null){
      bars+=`<path d="${wedgePath(cx,cy,0,2,a0,a1)}" fill="rgba(139,152,160,0.12)" stroke="none"/>`;
      continue;
    }
    const r=Math.max(3,(Math.abs(v)/maxAbs)*maxR);
    const color=v>0?'rgba(214,69,69,0.6)':'rgba(62,124,214,0.6)';
    const clickAttr=opts.captionId?` onclick="handleRoseClick(this)" data-dir="${compassLabel(angle)}" data-value="${(v>0?'+':'')+v.toFixed(1)}" data-caption="${opts.captionId}" data-suffix="${opts.unit||''}" style="cursor:pointer"`:'';
    bars+=`<path d="${wedgePath(cx,cy,0,r,a0,a1)}" fill="${color}" stroke="#E8ECEE" stroke-width="0.5"${clickAttr}><title>${compassLabel(angle)} : ${(v>0?'+':'')+v.toFixed(1)}${opts.unit||''}</title></path>`;
  }
  let grids='';
  if(opts.grid!==false){
    [0.5,1].forEach(f=>{grids+=`<circle cx="${cx}" cy="${cy}" r="${maxR*f}" fill="none" stroke="#262F35" stroke-width="1"/>`;});
  }
  let labels='';
  if(opts.labels!==false){
    [['N',0],['E',90],['S',180],['O',270]].forEach(([txt,ang])=>{
      const [lx,ly]=polarPoint(cx,cy,maxR+11,ang);
      labels+=`<text x="${lx}" y="${ly+4}" fill="#B8C0C6" font-size="10" font-weight="600" text-anchor="middle">${txt}</text>`;
    });
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grids}${bars}${labels}</svg>`;
}

function hourlyProfile(module,metric,days){
  const cutoff=new Date(Date.now()-days*86400000);
  const buckets=Array.from({length:24},()=>[]);
  (byRoomMetric[module+'|'+metric]||[]).filter(p=>p.t>=cutoff).forEach(p=>{
    buckets[p.t.getHours()].push(p.v);
  });
  return buckets.map(arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null);
}

function sunTimesLocalHours(date,lat,lon){
  const rad=Math.PI/180;
  const start=Date.UTC(date.getFullYear(),0,0);
  const dayOfYear=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-start)/86400000);
  const zenith=90.833*rad;
  function calc(isSunrise){
    const lngHour=lon/15;
    const t=dayOfYear+((isSunrise?6:18)-lngHour)/24;
    const M=(0.9856*t)-3.289;
    let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634;
    L=((L%360)+360)%360;
    let RA=(180/Math.PI)*Math.atan(0.91764*Math.tan(L*rad));
    RA=((RA%360)+360)%360;
    const Lq=Math.floor(L/90)*90, RAq=Math.floor(RA/90)*90;
    RA=(RA+(Lq-RAq))/15;
    const sinDec=0.39782*Math.sin(L*rad);
    const cosDec=Math.cos(Math.asin(sinDec));
    const cosH=(Math.cos(zenith)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
    if(cosH>1||cosH<-1)return null;
    let H=isSunrise?360-((180/Math.PI)*Math.acos(cosH)):((180/Math.PI)*Math.acos(cosH));
    H/=15;
    const T=H+RA-(0.06571*t)-6.622;
    return ((T-lngHour)%24+24)%24;
  }
  const sunriseUT=calc(true), sunsetUT=calc(false);
  function toLocalHour(utcH){
    if(utcH===null)return null;
    const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
    d.setUTCHours(Math.floor(utcH),Math.round((utcH%1)*60));
    return d.getHours()+d.getMinutes()/60;
  }
  return {sunrise:toLocalHour(sunriseUT),sunset:toLocalHour(sunsetUT)};
}

function buildRiseFallChart(days){
  const profile=hourlyProfile('Extérieur','Temperature',days);
  const known=profile.map((v,h)=>v!==null?h:null).filter(h=>h!==null);
  const caption=document.getElementById('riseFallCaption');
  const canvasWrap=document.getElementById('riseFallCanvasWrap');
  if(!known.length){
    caption.innerHTML='Pas assez de données horaires sur cette période pour estimer les heures de montée/descente.';
    canvasWrap.innerHTML='';
    return;

  let minH=known[0],maxH=known[0];

function calendarWindow(days,k){
  const now=new Date();
  if(days===1){
    const start=new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate()-k);
    const end=new Date(start); end.setDate(end.getDate()+1);
    return {start,end};
  }
  if(days===7){
    const start=new Date(now); start.setHours(0,0,0,0);
    const dow=(start.getDay()+6)%7;
    start.setDate(start.getDate()-dow-k*7);
    const end=new Date(start); end.setDate(end.getDate()+7);
    return {start,end};
  }
  if(days===30){
    const start=new Date(now.getFullYear(),now.getMonth()-k,1);
    const end=new Date(now.getFullYear(),now.getMonth()-k+1,1);
    return {start,end};
  }
  if(days===365){
    const start=new Date(now.getFullYear()-k,0,1);
    const end=new Date(now.getFullYear()-k+1,0,1);
    return {start,end};
  }
  const end=new Date(now.getTime()-k*days*86400000);
  const start=new Date(now.getTime()-(k+1)*days*86400000);
  return {start,end};
}

function windIntensityColor(v){
  if(v>40)return '#D64545';
  if(v>25)return '#E8A33D';
  return '#E8ECEE';
}

function aggregateDaily(pts,mode){
  const byDay={};
  pts.forEach(p=>{
    const k=p.t.toISOString().slice(0,10);
    if(!byDay[k])byDay[k]=[];
    byDay[k].push(p);
  });
  return Object.keys(byDay).sort().map(k=>{
    const vals=byDay[k];
    let v;
    if(mode==='max')v=Math.max(...vals.map(p=>p.v));
    else if(mode==='last')v=vals[vals.length-1].v;
    else v=vals.reduce((a,p)=>a+p.v,0)/vals.length;
    return {t:new Date(k+'T12:00:00Z'),v};
  });
}

function smoothedRates(pts,windowH){
  return pts.map(p=>{
    const targetT=p.t.getTime()-windowH*3600000;
    let best=null,bestDiff=Infinity;
    pts.forEach(q=>{
      if(q.t.getTime()>p.t.getTime())return;
      const diff=Math.abs(q.t.getTime()-targetT);
      if(diff<bestDiff){bestDiff=diff;best=q;}
    });
    if(!best||best===p)return 0;
    const dtH=(p.t-best.t)/3600000;
    return dtH>0.25?(p.v-best.v)/dtH:0;
  });
}

function buildWindChart(rangeDays){
  const cutoff=new Date(Date.now()-rangeDays*86400000);
  let avgPts=(byRoomMetric['Anémomètre|WindStrength']||[]).filter(p=>p.t>=cutoff);
  let gustPts=(byRoomMetric['Anémomètre|GustStrength']||[]).filter(p=>p.t>=cutoff);
  let anglePts=(byRoomMetric['Anémomètre|WindAngle']||[]).filter(p=>p.t>=cutoff);
  const aggregated=rangeDays>7;
  if(aggregated){
    avgPts=aggregateDaily(avgPts,'avg');
    gustPts=aggregateDaily(gustPts,'max');
    anglePts=aggregateDaily(anglePts,'last');
  }
  function nearestV(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return best;
  }

  const directionArrows={
    id:'directionArrows',
    afterDatasetsDraw(chart){
      if(!anglePts.length)return;
      const {ctx,chartArea,scales}=chart;
      const N=Math.min(aggregated?anglePts.length:14,anglePts.length);
      const step=Math.max(1,Math.floor(anglePts.length/N));
      ctx.save();
      for(let i=0;i<anglePts.length;i+=step){
        const p=anglePts[i];
        const x=scales.x.getPixelForValue(p.t);
        if(x<chartArea.left||x>chartArea.right)continue;
        const avgV=nearestV(avgPts,p.t), gustV=nearestV(gustPts,p.t);
        const avgY=avgV!==null?scales.y.getPixelForValue(avgV):chartArea.bottom;
        const gustY=gustV!==null?scales.y.getPixelForValue(gustV):avgY;
        const y=Math.min(avgY,gustY)-22;
        const goingTo=(p.v+180)%360;
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(goingTo*Math.PI/180);
        ctx.fillStyle=windIntensityColor(Math.max(avgV||0,gustV||0));
        ctx.beginPath();
        ctx.moveTo(0,-5); ctx.lineTo(-3,3); ctx.lineTo(3,3); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
  };

  return new Chart(document.getElementById('windChart'),{
    type:'line',
    data:{datasets:[
      {label:'Moyenne',data:avgPts.map(p=>({x:p.t,y:p.v})),
       borderWidth:aggregated?2:1.2,pointRadius:aggregated?2:0,tension:0.42,_baseTension:0.42,
       segment:{borderColor:ctx=>windIntensityColor(Math.max(ctx.p0.parsed.y,ctx.p1.parsed.y))},
       borderColor:'#E8ECEE',fill:true,
       backgroundColor:(context)=>{
         const {ctx,chartArea}=context.chart;
         if(!chartArea)return 'rgba(232,236,238,0.15)';
         const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
         g.addColorStop(0,'rgba(232,236,238,0.28)');
         g.addColorStop(1,'rgba(232,236,238,0)');
         return g;
       }},
      {label:'Rafale',data:gustPts.map(p=>({x:p.t,y:p.v})),
       borderWidth:aggregated?2:1.2,pointRadius:aggregated?2:0,borderDash:[5,4],tension:0.42,_baseTension:0.42,
       segment:{borderColor:ctx=>windIntensityColor(Math.max(ctx.p0.parsed.y,ctx.p1.parsed.y))},
       borderColor:'#E8ECEE',fill:false}
    ].filter(s=>s.data.length>0)},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:20}},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},zoom:ZOOM_OPTS,tooltip:{callbacks:{title:tooltipTitle24,label:(ctx)=>(ctx.dataset.label||'')+': '+ctx.parsed.y+' km/h'}}},
      scales:{x:timeAxis(),
              y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}
    },
    plugins:[directionArrows]
  });
}

function buildCalendarSection(rows){
  const extTemp={}, sejTemp={}, windSpeed={};
  rows.forEach(r=>{
    const key=new Date(r.timestamp_utc).toISOString().slice(0,10);
    if(r.module==='Extérieur'&&r.metric==='Temperature')(extTemp[key]=extTemp[key]||[]).push(r.value);
    if(r.module==='Séjour'&&r.metric==='Temperature')(sejTemp[key]=sejTemp[key]||[]).push(r.value);
    if(r.module==='Anémomètre'&&r.metric==='WindStrength')(windSpeed[key]=windSpeed[key]||[]).push(r.value);
  });
  const allDays=new Set([...Object.keys(extTemp),...Object.keys(sejTemp),...Object.keys(windSpeed)]);
  if(!allDays.size)return;
  const dayStats={};
  allDays.forEach(k=>{
    dayStats[k]={
      tempMax: extTemp[k]?Math.max(...extTemp[k]):null,
      tempMin: extTemp[k]?Math.min(...extTemp[k]):null,
      sejMax: sejTemp[k]?Math.max(...sejTemp[k]):null,
      sejMin: sejTemp[k]?Math.min(...sejTemp[k]):null,
      windAvg: windSpeed[k]?(windSpeed[k].reduce((a,b)=>a+b,0)/windSpeed[k].length):null
    };
  });
  const sortedKnown=[...allDays].sort();
  const firstDate=new Date(sortedKnown[0]+'T00:00:00Z');
  const lastDate=new Date();
  lastDate.setUTCHours(0,0,0,0);

  // liste continue de tous les jours entre la première mesure et aujourd'hui
  const allSortedDays=[];
  const byMonth={};
  for(let d=new Date(firstDate); d<=lastDate; d.setUTCDate(d.getUTCDate()+1)){
    const k=d.toISOString().slice(0,10);
    allSortedDays.push(k);
    const mk=k.slice(0,7);
    if(!byMonth[mk])byMonth[mk]=[];
    byMonth[mk].push(k);
  }
  const monthKeys=Object.keys(byMonth).sort();
  const monthNames=['jan.','fév.','mar.','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];

  const main=document.getElementById('mainContent');
  main.insertAdjacentHTML('beforeend',`
    <div class="cal-section">
      <h2>Calendrier</h2>
      <div class="tabs" id="calTabs">
        ${Object.entries(CAL_METRICS).map(([k,v])=>`<button data-m="${k}">${v.label}</button>`).join('')}
      </div>
      <p class="insight-caption" id="calSelected">Touche une case pour voir sa valeur.</p>
      <div id="calRows"></div>
      <div class="scale"><span id="calScaleLo">—</span><div class="grad" id="calGrad"></div><span id="calScaleHi">—</span></div>
    </div>
  `);

  function render(metricKey){
    const cfg=CAL_METRICS[metricKey];
    const vals=allSortedDays.map(k=>dayStats[k]&&dayStats[k][metricKey]).filter(v=>v!==null&&v!==undefined);
    if(!vals.length)return;
    const vmin=Math.min(...vals), vmax=Math.max(...vals);
    document.getElementById('calScaleLo').textContent=vmin.toFixed(1);
    document.getElementById('calScaleHi').textContent=vmax.toFixed(1);
    document.getElementById('calGrad').style.background=`linear-gradient(to right,#${cfg.ramp[0]},${mix(cfg.ramp[0],cfg.ramp[1],1)})`;
    document.getElementById('calSelected').textContent='Touche une case pour voir sa valeur.';
    const rowsWrap=document.getElementById('calRows');
    rowsWrap.innerHTML='';
    monthKeys.forEach(mk=>{
      const [y,m]=mk.split('-');
      const row=document.createElement('div');
      row.className='cal-row';
      const label=document.createElement('div');
      label.className='month-label';
      label.textContent=monthNames[parseInt(m,10)-1]+' '+y;
      row.appendChild(label);
      const daysWrap=document.createElement('div');
      daysWrap.className='days';
      byMonth[mk].forEach(k=>{
        const v=dayStats[k]?dayStats[k][metricKey]:null;
        const cell=document.createElement('div');
        cell.className='cal-day';
        if(v!==null&&v!==undefined){
          const norm=vmax>vmin?(v-vmin)/(vmax-vmin):0.5;
          cell.style.background=mix(cfg.ramp[0],cfg.ramp[1],norm);
          cell.style.cursor='pointer';
          cell.addEventListener('click',()=>{
            const unit=metricKey==='windAvg'?'km/h':'°C';
            const dateFmt=new Date(k+'T12:00:00Z').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
            document.getElementById('calSelected').innerHTML=`<b>${dateFmt}</b> — ${cfg.label} : <b>${v.toFixed(1)}${unit}</b>`;
          });
        }
        daysWrap.appendChild(cell);
      });
      row.appendChild(daysWrap);
      rowsWrap.appendChild(row);
    });
  }
  document.querySelectorAll('#calTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#calTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.m);
    });
  });
  document.querySelector('#calTabs button[data-m="tempMax"]').classList.add('active');
  render('tempMax');
}

function findGapPeaks(combined){
  const peaks=[];
  let runStart=0, runSign=null;
  function closeRun(endIdx){
    if(runSign===null||runSign===0)return;
    let maxIdx=runStart, maxAbs=0;
    for(let i=runStart;i<endIdx;i++){
      const d=combined[i].ext-combined[i].sej;
      if(Math.abs(d)>maxAbs){maxAbs=Math.abs(d);maxIdx=i;}
    }
    if(maxAbs>=1.5){
      const c=combined[maxIdx];
      peaks.push({
        t:c.t, y:c.ext, diff:c.ext-c.sej, sign:runSign,
        crossStart:combined[runStart].t,
        crossEnd:combined[Math.max(runStart,endIdx-1)].t
      });
    }
  }
  combined.forEach((c,i)=>{
    const d=c.ext-c.sej;
    const sign=d>0.05?1:(d<-0.05?-1:0);
    if(runSign===null){runSign=sign;runStart=i;}
    else if(sign!==0&&sign!==runSign){
      closeRun(i);
      runSign=sign; runStart=i;
    }
  });
  closeRun(combined.length);
  peaks.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  const top=peaks.slice(0,40);
  top.sort((a,b)=>a.t-b.t);
  return top;
}

function buildTempCompareChart(rangeDays){
  const cutoff=new Date(Date.now()-rangeDays*86400000);
  const extPts=(byRoomMetric['Extérieur|Temperature']||[]).filter(p=>p.t>=cutoff).sort((a,b)=>a.t-b.t);
  const sejPts=(byRoomMetric['Séjour|Temperature']||[]).filter(p=>p.t>=cutoff).sort((a,b)=>a.t-b.t);
  function nearestVal(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return best;
  }
  const combined=extPts.map(p=>{
    const sv=nearestVal(sejPts,p.t);
    return sv!==null?{t:p.t,ext:p.v,sej:sv}:null;
  }).filter(v=>v!==null);

  const redData=combined.map(c=>({x:c.t,y:c.ext>c.sej?c.ext:c.sej}));
  const blueData=combined.map(c=>({x:c.t,y:c.ext<c.sej?c.ext:c.sej}));
  const sejData=combined.map(c=>({x:c.t,y:c.sej}));
  const extData=combined.map(c=>({x:c.t,y:c.ext}));
  const peaks=findGapPeaks(combined);

  const gapLabels={
    id:'gapLabels',
    afterDatasetsDraw(chart){
      const {ctx,scales,chartArea}=chart;
      ctx.save();
      ctx.font='10px JetBrains Mono, monospace';
      ctx.textAlign='center';
      peaks.forEach(p=>{
        const x=scales.x.getPixelForValue(p.t);
        if(x>=chartArea.left&&x<=chartArea.right){
          const y=scales.y.getPixelForValue(p.y);
          const color=p.sign===1?'#D64545':'#3E7CD6';
          const label=(p.diff>0?'+':'')+p.diff.toFixed(1)+'°';
          ctx.fillStyle=color;
          ctx.fillText(label, x, p.sign===1?y-8:y+18);
        }
      });
      // repères d'heure de transition, pleine hauteur, dédupliqués si trop proches à l'écran
      const crossXs=[];
      peaks.forEach(p=>{
        [p.crossStart,p.crossEnd].forEach(ct=>{
          const cx=scales.x.getPixelForValue(ct);
          if(cx<chartArea.left||cx>chartArea.right)return;
          if(crossXs.some(prev=>Math.abs(prev.cx-cx)<28))return;
          crossXs.push({cx,ct});
        });
      });
      crossXs.forEach(({cx,ct})=>{
        ctx.strokeStyle='rgba(232,236,238,0.28)'; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(cx,chartArea.top); ctx.lineTo(cx,chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]);
        const hh=ct.getHours().toString().padStart(2,'0')+':'+ct.getMinutes().toString().padStart(2,'0');
        ctx.save();
        ctx.translate(cx,chartArea.top-4);
        ctx.rotate(-Math.PI/2);
        ctx.fillStyle='#8B98A0';
        ctx.font='9px JetBrains Mono, monospace';
        ctx.textAlign='left';
        ctx.fillText(hh, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }
  };

  return new Chart(document.getElementById('tempCompareChart'),{
    type:'line',
    data:{datasets:[
      {label:'Extérieur plus chaud',data:redData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:2,backgroundColor:'rgba(214,69,69,0.45)'},
      {label:'Extérieur plus froid',data:blueData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:2,backgroundColor:'rgba(62,124,214,0.45)'},
      {label:'Séjour',data:sejData,borderColor:'#E8ECEE',backgroundColor:'#E8ECEE',borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42,fill:false},
      {label:'Extérieur',data:extData,borderWidth:0,pointRadius:0,tension:0.42,_baseTension:0.42,fill:false,borderColor:'rgba(0,0,0,0)'}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:34}},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},zoom:ZOOM_OPTS,
        tooltip:{filter:(item)=>item.datasetIndex>=2,
          callbacks:{title:tooltipTitle24,label:(ctx)=>(ctx.datasetIndex===2?'Séjour: ':'Extérieur: ')+ctx.parsed.y.toFixed(1)+'°C'}}},
      scales:{x:timeAxis(),
              y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}
    },
    plugins:[gapLabels]
  });
}

function nightWindow(daysAgo){
  const end=new Date(); end.setHours(7,0,0,0); end.setDate(end.getDate()-daysAgo);
  const start=new Date(end); start.setDate(start.getDate()-1); start.setHours(23,0,0,0);
  return {start,end};
}
function estimateDurationAbove(pts,threshold){
  const sorted=pts.slice().sort((a,b)=>a.t-b.t);
  let totalMs=0;
  for(let i=0;i<sorted.length-1;i++){
    if(sorted[i].v>threshold){
      totalMs+=Math.min(sorted[i+1].t-sorted[i].t,45*60000);
    }
  }
  return totalMs/60000;
}
function nightScoreColor(score){
  if(score>=80)return '#3FAE56';
  if(score>=60)return '#E0B23D';
  if(score>=40)return '#E8A33D';
  return '#D64545';
}
function computeNightStats(daysAgo){
  const {start,end}=nightWindow(daysAgo);
  function seriesIn(metric){return (byRoomMetric['Chambre|'+metric]||[]).filter(p=>p.t>=start&&p.t<end);}
  const temp=seriesIn('Temperature'), hum=seriesIn('Humidity'), co2=seriesIn('CO2'), noise=seriesIn('Noise');
  if(!temp.length&&!co2.length&&!noise.length)return null;
  const avg=arr=>arr.length?arr.reduce((a,p)=>a+p.v,0)/arr.length:null;
  const max=arr=>arr.length?Math.max(...arr.map(p=>p.v)):null;
  const tempAvg=avg(temp), humAvg=avg(hum), co2Avg=avg(co2), co2Max=max(co2), noiseAvg=avg(noise), noiseMax=max(noise);
  const co2Above1000=estimateDurationAbove(co2,1000);
  let score=100;
  if(co2Avg!==null){ if(co2Avg>1500)score-=35; else if(co2Avg>1000)score-=20; else if(co2Avg>800)score-=8; }
  if(co2Max!==null&&co2Max>1500)score-=10;
  if(tempAvg!==null){ if(tempAvg<15||tempAvg>22)score-=15; else if(tempAvg<16||tempAvg>20)score-=6; }
  if(humAvg!==null){ if(humAvg<30||humAvg>70)score-=15; else if(humAvg<40||humAvg>60)score-=6; }
  if(noiseAvg!==null&&noiseAvg>38)score-=10;
  if(noiseMax!==null&&noiseMax>55)score-=6;
  score=Math.max(0,Math.min(100,Math.round(score)));
  return {start,end,score,tempAvg,humAvg,co2Avg,co2Max,noiseAvg,noiseMax,co2Above1000};
}

function detectSolarGainHours(room){
  const tempPts=(byRoomMetric[room+'|Temperature']||[]).slice().sort((a,b)=>a.t-b.t);
  const extPts=byRoomMetric['Extérieur|Temperature']||[];
  const co2Pts=byRoomMetric[room+'|CO2']||[];
  const humPts=byRoomMetric[room+'|Humidity']||[];
  function nearestVal(pts,t){
    let best=null,bd=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.t-t); if(d<bd){bd=d;best=p.v;}});
    return bd<3600000?best:null;
  }
  const hourCounts=new Array(24).fill(0);
  let total=0;
  for(let i=0;i<tempPts.length-1;i++){
    const dtH=(tempPts[i+1].t-tempPts[i].t)/3600000;
    if(dtH<=0||dtH>2)continue;
    const dTemp=tempPts[i+1].v-tempPts[i].v;
    if(dTemp<0.8)continue;
    const extA=nearestVal(extPts,tempPts[i].t), extB=nearestVal(extPts,tempPts[i+1].t);
    if(extA===null||extB===null||Math.abs(extB-extA)>1.2)continue;
    const co2A=nearestVal(co2Pts,tempPts[i].t), co2B=nearestVal(co2Pts,tempPts[i+1].t);
    if(co2A!==null&&co2B!==null&&Math.abs(co2B-co2A)>60)continue;
    const humA=nearestVal(humPts,tempPts[i].t), humB=nearestVal(humPts,tempPts[i+1].t);
    if(humA!==null&&humB!==null&&Math.abs(humB-humA)>4)continue;
    hourCounts[tempPts[i].t.getHours()]++;
    total++;
  }
  return {hourCounts,total};
}
function buildSolarGainSection(){
  const rooms=['Séjour','Cuisine','Chambre'];
  const results=rooms.map(r=>({room:r,...detectSolarGainHours(r)})).filter(r=>r.total>=3);
  const main=document.getElementById('mainContent');
  if(!results.length){
    main.insertAdjacentHTML('beforeend','<div class="cal-section"><h2>☀️ Apports solaires probables</h2><div class="empty">Pas assez d\'épisodes détectés pour dégager une tendance (montée de température sans hausse extérieure ni activité).</div></div>');
    return;
  }
  const rowsHtml=results.map(r=>{
    const maxCount=Math.max(...r.hourCounts);
    const bars=r.hourCounts.map((c,h)=>{
      const norm=maxCount?c/maxCount:0;
      return `<div style="width:9px;flex-shrink:0;height:24px;display:flex;align-items:flex-end;" title="${h}h : ${c} épisode(s)"><div style="width:100%;height:${Math.max(2,norm*24)}px;background:${c?'#E8A33D':'#20272d'};border-radius:1px;"></div></div>`;
    }).join('');
    let peakH=0; r.hourCounts.forEach((c,h)=>{if(c>r.hourCounts[peakH])peakH=h;});
    return `<div class="card" style="margin-bottom:10px;">
      <div class="room-title">${r.room} <span style="font-weight:400;color:var(--text-muted);font-size:12px;">— surtout vers ${peakH}h (${r.total} épisodes au total)</span></div>
      <div style="display:flex;gap:1px;">${bars}</div>
    </div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend',`
    <div class="cal-section">
      <h2>☀️ Apports solaires probables</h2>
      <p class="hint">Détecté quand la température d'une pièce monte sans que l'extérieur, le CO2 ou l'humidité ne bougent significativement — signe d'un réchauffement par le soleil plutôt que par l'activité ou le chauffage.</p>
      <div style="max-width:480px;">${rowsHtml}</div>
    </div>
  `);
}

function computeRecords(rows,year){
  return RECORD_METRICS.map(rm=>{
    const pts=rows.filter(r=>r.module===rm.module&&r.metric===rm.metric&&(year==='all'||new Date(r.timestamp_utc).getFullYear()===year));
    if(!pts.length)return {...rm,value:null,date:null};
    let best=pts[0];
    pts.forEach(p=>{
      if(rm.agg==='max'&&p.value>best.value)best=p;
      if(rm.agg==='min'&&p.value<best.value)best=p;
    });
    return {...rm,value:best.value,date:new Date(best.timestamp_utc)};
  });
}

function computeTimeInZone(room,metric,bucketSize,rangeStart,rangeEnd){
  const pts=(byRoomMetric[room+'|'+metric]||[]).filter(p=>p.t>=rangeStart&&p.t<rangeEnd).sort((a,b)=>a.t-b.t);
  const buckets={};
  for(let i=0;i<pts.length-1;i++){
    const dt=(pts[i+1].t-pts[i].t)/60000;
    if(dt<=0||dt>180)continue;
    const b=Math.floor(pts[i].v/bucketSize)*bucketSize;
    buckets[b]=(buckets[b]||0)+dt;
  }
  return buckets;
}
function buildTimeInZoneSection(){
  const today=new Date(); today.setHours(0,0,0,0);

  rooms.forEach(room=>{

    const keys=Object.keys(buckets).map(Number).sort((a,b)=>a-b);
    if(!keys.length)return;
    const maxMin=Math.max(...keys.map(k=>buckets[k]));
    const rows=keys.map(k=>{
      const mins=buckets[k];
      const norm=maxMin?mins/maxMin:0;
      const barW=Math.max(4,norm*180);

    contentHtml+=`<div class="card" style="margin-bottom:10px;"><div class="room-title">${room}</div>${rows}</div>`;
  });
  if(!contentHtml){
    main.insertAdjacentHTML('beforeend','<div class="cal-section"><h2>🕯️ Temps passé par tranche de température</h2><div class="empty">Pas assez de données aujourd\'hui.</div></div>');

  main.insertAdjacentHTML('beforeend',`

  `);

function buildDashboard(rows){
  byRoomMetric={};
  rows.forEach(r=>{
    const key=r.module+'|'+r.metric;
    if(!byRoomMetric[key])byRoomMetric[key]=[];
    byRoomMetric[key].push({t:new Date(r.timestamp_utc),v:r.value});
  });

  const rooms=[...new Set(rows.map(r=>r.module))].filter(r=>r!=='Anémomètre');
  function colorFor(room){return ROOM_COLOR[room]||EXT_COLOR;}

  const main=document.getElementById('mainContent');
  main.innerHTML=`
    <h2>Température</h2>
    <div class="tabs" id="rangeTabs">
      <button data-r="day">Jour</button><button data-r="week">Semaine</button>
      <button data-r="month">Mois</button><button data-r="season">Saison</button><button data-r="year">Année</button>
    </div>
    <p class="hint">Molette ou pincement pour zoomer, glisser pour vous déplacer dans le temps.</p>
    <div class="legend" id="legend"></div>
    <div class="chartbox">${chartWrap('tempChart','°C')}</div>
    <h2>Extérieur vs Séjour</h2>
    <div class="legend"><span><span class="dot" style="background:#E8ECEE"></span>Séjour</span><span><span class="dot" style="background:#D64545"></span>Extérieur plus chaud</span><span><span class="dot" style="background:#3E7CD6"></span>Extérieur plus froid</span></div>
    <p class="hint">Écart maximal affiché sur chaque zone significative. Heures de passage affichées en vues Jour/Semaine.</p>
    <div class="chartbox">${chartWrap('tempCompareChart','°C')}</div>
    <h2>Humidité</h2>
    <div class="chartbox">${chartWrap('humChart','%')}</div>
    <h2>CO2</h2>
    <div class="chartbox">${chartWrap('co2Chart','ppm')}</div>
    <h2>Pression</h2>
    <div class="legend"><span><span class="dot" style="background:#8B98A0"></span>Stable</span><span><span class="dot" style="background:#E8A33D"></span>Évolution modérée</span><span><span class="dot" style="background:#D64545"></span>Chute rapide</span><span><span class="dot" style="background:#3E7CD6"></span>Remontée rapide</span></div>
    <div class="chartbox">${chartWrap('pressureChart','hPa')}</div>
    <h2>Bruit — Séjour &amp; Chambre</h2>
    <div class="chartbox">${chartWrap('noiseChart','dB')}</div>
    <h2>Vent</h2>
    <div id="windRoseSlot"></div>
    <div class="legend"><span><span class="dot" style="background:#E8ECEE"></span>Moyenne</span><span><span class="dash"></span>Rafale</span><span><span class="dot" style="background:#E8A33D"></span>Fort</span><span><span class="dot" style="background:#D64545"></span>Très fort</span></div>
    <p class="hint">Les petites flèches indiquent la direction du vent vers laquelle il souffle.</p>
    <div class="chartbox">${chartWrap('windChart','km/h')}</div>
    <h2>À quelle heure ça monte / ça descend ?</h2>
    <p class="insight-caption" id="riseFallCaption"></p>
    <div class="chartbox small" id="riseFallCanvasWrap"></div>
    <h2>Aujourd'hui vs jours précédents — Extérieur</h2>
    <div class="chartbox" id="dayOverlayCanvasWrap"></div>
    <div id="minmaxSlot"></div>
  `;

  const legend=document.getElementById('legend');
  rooms.forEach(r=>{
    const el=document.createElement('span');
    el.innerHTML=`<span class="dot" style="background:${colorFor(r)}"></span>${r}`;
    legend.appendChild(el);
  });

  function seriesFor(metric,rangeDays){
    const cutoff=new Date(Date.now()-rangeDays*86400000);
    return rooms.map(room=>{
      const key=room+'|'+metric;
      const pts=(byRoomMetric[key]||[]).filter(p=>p.t>=cutoff);
      return {label:room,data:pts.map(p=>({x:p.t,y:p.v})),borderColor:colorFor(room),backgroundColor:colorFor(room),borderWidth:2,pointRadius:0,tension:0.42,_baseTension:0.42};
    }).filter(s=>s.data.length>0);
  }

  let charts={};
  function makeChart(id,dataset,unit){
    if(charts[id])charts[id].destroy();
    charts[id]=new Chart(document.getElementById(id),{
      type:'line',
      data:{datasets:dataset},
      options:{
        responsive:true,maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},zoom:ZOOM_OPTS,tooltip:{enabled:true,callbacks:{title:tooltipTitle24,label:(ctx)=>(ctx.dataset.label||'')+': '+ctx.parsed.y+unit}}},
        scales:{x:timeAxis(),
                y:{ticks:{color:'#8B98A0'},grid:{color:'#262F35'}}}
      }
    });
  }

  const rangeDays={day:1,week:7,month:30,season:90,year:365};
  function render(range){
    const d=rangeDays[range];
    syncedCharts=[];
    makeChart('tempChart',seriesFor('Temperature',d),'°C');
    makeChart('humChart',seriesFor('Humidity',d),'%');
    makeChart('co2Chart',seriesFor('CO2',d),' ppm');
    makeChart('noiseChart',seriesFor('Noise',d),' dB');
    if(charts['pressureChart'])charts['pressureChart'].destroy();
    charts['pressureChart']=buildPressureChart(d);
    if(charts['tempCompareChart'])charts['tempCompareChart'].destroy();
    charts['tempCompareChart']=buildTempCompareChart(d);
    if(charts['windChart'])charts['windChart'].destroy();
    charts['windChart']=buildWindChart(d);
    syncedCharts=Object.values(charts);
    buildRiseFallChart(d);
    buildDayOverlayChart(d);
  }
  document.querySelectorAll('#rangeTabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#rangeTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');render(b.dataset.r);
    });
  });
  document.querySelector('#rangeTabs button[data-r="week"]').classList.add('active');
  render('week');
  buildDailyMinMaxChart(rows);
  buildWindRose7d();
  buildWindImpactRoses();
  buildWeeklyProfileHeatmap(rows);
  buildTodayTimeline();
  buildNightScores();
  buildSolarGainSection();
  buildRecordsSection(rows);
  buildTimeInZoneSection();
  buildCalendarSection(rows);
}

async function init(){
  let latest=null, rows=[];
  try{ latest=await fetchJSON('data/latest.json'); }catch(e){}
  try{
    const text=await fetchText('data/history.csv');
    if(text.trim()){
      const parsed=Papa.parse(text,{header:true,dynamicTyping:true,skipEmptyLines:true});
      rows=parsed.data;
      byRoomMetric={};
      rows.forEach(r=>{
        const key=r.module+'|'+r.metric;
        if(!byRoomMetric[key])byRoomMetric[key]=[];
        byRoomMetric[key].push({t:new Date(r.timestamp_utc),v:r.value});
      });
    }
  }catch(e){}

  if(latest){
    renderCards(latest);
  }else{
    document.getElementById('lastUpdate').textContent="Pas encore de données — le premier relevé Netatmo n'a pas encore été collecté.";
  }

  if(rows.length){
    try{
      buildDashboard(rows);
    }catch(e){
      document.getElementById('mainContent').innerHTML='<div class="empty">Une erreur est survenue.<br><span style="font-size:11px;">'+e.message+'</span></div>';
    }
  }else{
    document.getElementById('mainContent').innerHTML='<div class="empty">Pas encore d\'historique à afficher.</div>';
  }
}
init();
</script>
</body>
</html>
