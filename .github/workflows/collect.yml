name: Collecte météo Netatmo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter les données Netatmo
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: python collect.py

      - name: Committer et pousser les nouvelles données
        run: |
          git config user.name "b3d-meteo-bot"
          git config user.email "actions@github.com"
          git add data/history.csv data/latest.json
          git diff --staged --quiet || git commit -m "Relevé $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
